# Prometheus Configuration for AIRA Infrastructure Simulation

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'aira-infra-simulation'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # API Service
  - job_name: 'api-service'
    static_configs:
      - targets: ['api-service:9090']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Payment Service
  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:9091']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Database Service
  - job_name: 'db-service'
    static_configs:
      - targets: ['db-service:9092']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Cache Service
  - job_name: 'cache-service'
    static_configs:
      - targets: ['cache-service:9093']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
