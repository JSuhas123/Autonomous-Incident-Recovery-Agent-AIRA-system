version: '3.8'

# AIRA Infrastructure Simulation
# Realistic microservices with failure injection points
# Use with: docker-compose -f infra-simulation/docker-compose.yml up

services:
  # ============ API Gateway ============
  api-service:
    image: node:18-alpine
    container_name: aira-api-service
    working_dir: /app
    volumes:
      - ./services/api-service.js:/app/server.js
      - ./services/metrics-handler.js:/app/metrics.js
    ports:
      - "3001:3001"
    environment:
      SERVICE_NAME: api-service
      PORT: 3001
      PAYMENT_SERVICE_URL: http://payment-service:3002
      DB_SERVICE_URL: http://db-service:3003
      CACHE_SERVICE_URL: http://cache-service:3004
      METRICS_PORT: 9090
      LOG_LEVEL: info
    depends_on:
      - cache-service
      - db-service
      - payment-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aira-net

  # ============ Payment Service ============
  payment-service:
    image: node:18-alpine
    container_name: aira-payment-service
    working_dir: /app
    volumes:
      - ./services/payment-service.js:/app/server.js
      - ./services/failure-injector.js:/app/failure-injector.js
    ports:
      - "3002:3002"
    environment:
      SERVICE_NAME: payment-service
      PORT: 3002
      DB_SERVICE_URL: http://db-service:3003
      CACHE_SERVICE_URL: http://cache-service:3004
      METRICS_PORT: 9091
      LOG_LEVEL: info
      # Failure injection environment variables
      FAILURE_MODE: none  # Options: none, crash, latency, memory-leak, db-exhaustion
      FAILURE_RATE: 0     # Percentage (0-100)
      FAILURE_DURATION_MS: 5000
    depends_on:
      - db-service
      - cache-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aira-net

  # ============ Database Service ============
  db-service:
    image: node:18-alpine
    container_name: aira-db-service
    working_dir: /app
    volumes:
      - ./services/db-service.js:/app/server.js
      - ./services/failure-injector.js:/app/failure-injector.js
    ports:
      - "3003:3003"
    environment:
      SERVICE_NAME: db-service
      PORT: 3003
      METRICS_PORT: 9092
      LOG_LEVEL: info
      FAILURE_MODE: none
      FAILURE_RATE: 0
      CONNECTION_POOL_SIZE: 10
      QUERY_TIMEOUT_MS: 5000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aira-net

  # ============ Cache Service ============
  cache-service:
    image: node:18-alpine
    container_name: aira-cache-service
    working_dir: /app
    volumes:
      - ./services/cache-service.js:/app/server.js
      - ./services/failure-injector.js:/app/failure-injector.js
    ports:
      - "3004:3004"
    environment:
      SERVICE_NAME: cache-service
      PORT: 3004
      METRICS_PORT: 9093
      LOG_LEVEL: info
      FAILURE_MODE: none
      FAILURE_RATE: 0
      MAX_CACHE_SIZE_MB: 256
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aira-net

  # ============ Prometheus (Metrics Collection) ============
  prometheus:
    image: prom/prometheus:latest
    container_name: aira-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libs'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - aira-net
    depends_on:
      - api-service
      - payment-service
      - db-service
      - cache-service

  # ============ Grafana (Visualization) ============
  grafana:
    image: grafana/grafana:latest
    container_name: aira-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - aira-net
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  aira-net:
    driver: bridge
