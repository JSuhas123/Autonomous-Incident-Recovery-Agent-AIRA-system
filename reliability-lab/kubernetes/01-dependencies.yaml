apiVersion: apps/v1
kind: Deployment

metadata:
  name: rabbitmq
  namespace: aira-reliability-lab

  labels:
    app: rabbitmq
    aira.reliability-lab: "true"
    aira.phase: "21"
    aira.safety-class: "LAB_ONLY"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rabbitmq

  template:
    metadata:
      labels:
        app: rabbitmq
        aira.reliability-lab: "true"
        aira.phase: "21"
        aira.safety-class: "LAB_ONLY"
        aira.resource-type: "rabbitmq.broker"

    spec:
      initContainers:
        - name: prepare-rabbitmq-data

          image: rabbitmq:3.13-management-alpine
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /var/lib/rabbitmq
              rm -f /var/lib/rabbitmq/.erlang.cookie
              chown -R rabbitmq:rabbitmq /var/lib/rabbitmq
              chmod 700 /var/lib/rabbitmq

          securityContext:
            runAsUser: 0
            runAsGroup: 0

          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq

      containers:
        - name: rabbitmq

          image: rabbitmq:3.13-management-alpine
          imagePullPolicy: IfNotPresent

          env:
            - name: RABBITMQ_DEFAULT_USER
              value: guest

            - name: RABBITMQ_DEFAULT_PASS
              value: guest

          ports:
            - containerPort: 5672
              name: amqp

            - containerPort: 15672
              name: management

                    startupProbe:
            tcpSocket:
              port: amqp

            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36

          readinessProbe:
            tcpSocket:
              port: amqp

            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: amqp

            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4

          resources:
            requests:
              cpu: 50m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq

      volumes:
        - name: rabbitmq-data
          emptyDir: {}


---

apiVersion: v1
kind: Service

metadata:
  name: rabbitmq
  namespace: aira-reliability-lab

  labels:
    app: rabbitmq
    aira.reliability-lab: "true"
    aira.phase: "21"
    aira.safety-class: "LAB_ONLY"

spec:
  selector:
    app: rabbitmq

  ports:
    - name: amqp
      port: 5672
      targetPort: amqp

    - name: management
      port: 15672
      targetPort: management