apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: aira-reliability-lab

  labels:
    app: postgres
    aira.reliability-lab: "true"
    aira.phase: "21"
    aira.safety-class: "LAB_ONLY"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres
        aira.reliability-lab: "true"
        aira.phase: "21"
        aira.safety-class: "LAB_ONLY"
        aira.resource-type: "postgres.database"

    spec:
      containers:
        - name: postgres

          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent

          env:
            - name: POSTGRES_DB
              value: aira_lab

            - name: POSTGRES_USER
              value: aira_lab

            - name: POSTGRES_PASSWORD
              value: aira_lab_password

          ports:
            - containerPort: 5432
              name: postgres

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - aira_lab
                - -d
                - aira_lab

            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - aira_lab
                - -d
                - aira_lab

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-data
          emptyDir: {}


---

apiVersion: v1
kind: Service

metadata:
  name: postgres
  namespace: aira-reliability-lab

  labels:
    app: postgres
    aira.reliability-lab: "true"
    aira.phase: "21"
    aira.safety-class: "LAB_ONLY"

spec:
  selector:
    app: postgres

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres


