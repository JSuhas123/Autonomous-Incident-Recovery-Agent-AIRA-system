apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: aira-reliability-lab

  labels:
    app: redis
    aira.reliability-lab: "true"
    aira.phase: "21"
    aira.safety-class: "LAB_ONLY"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis
        aira.reliability-lab: "true"
        aira.phase: "21"
        aira.safety-class: "LAB_ONLY"
        aira.resource-type: "redis.instance"

    spec:
      containers:
        - name: redis

          image: redis:7-alpine
          imagePullPolicy: IfNotPresent

          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"

          ports:
            - containerPort: 6379
              name: redis

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping

            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: 25m
              memory: 32Mi

            limits:
              cpu: 250m
              memory: 128Mi

          volumeMounts:
            - name: redis-data
              mountPath: /data

      volumes:
        - name: redis-data
          emptyDir: {}


---

apiVersion: v1
kind: Service

metadata:
  name: redis
  namespace: aira-reliability-lab

  labels:
    app: redis
    aira.reliability-lab: "true"
