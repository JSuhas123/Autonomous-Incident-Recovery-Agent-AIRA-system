apiVersion: apps/v1
kind: Deployment

metadata:
  name: lab-api
  namespace: aira-reliability-lab

  labels:
    app: lab-api
    aira.reliability-lab: "true"
    aira.phase: "21"
    aira.safety-class: "LAB_ONLY"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: lab-api

  template:

    metadata:

      labels:
        app: lab-api
        aira.reliability-lab: "true"
        aira.phase: "21"
        aira.safety-class: "LAB_ONLY"
        aira.resource-type: "application.api"

    spec:

      containers:

        - name: lab-api

          image: aira-reliability-fixture:21.6-v1

          imagePullPolicy: Never

          env:

            - name: SERVICE_ROLE
              value: api

            - name: PORT
              value: "8080"

            - name: AIRA_LAB_ID
              value: aira-reliability-lab

            - name: AIRA_SAFETY_CLASS
              value: LAB_ONLY

            - name: POSTGRES_URL
              value: postgresql://aira_lab:aira_lab_password@postgres:5432/aira_lab

            - name: REDIS_URL
              value: redis://redis:6379

            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672

            - name: RABBITMQ_QUEUE
              value: aira.reliability.orders

          ports:

            - containerPort: 8080
              name: http

          readinessProbe:

            httpGet:
              path: /ready
              port: http

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 20

          livenessProbe:

            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:

            requests:
              cpu: 25m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 256Mi


---

apiVersion: v1
kind: Service

metadata:
  name: lab-api
  namespace: aira-reliability-lab

  labels:
    app: lab-api
    aira.reliability-lab: "true"
    aira.phase: "21"
    aira.safety-class: "LAB_ONLY"

spec:

  type: NodePort

  selector:
    app: lab-api

  ports:

    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080


---

