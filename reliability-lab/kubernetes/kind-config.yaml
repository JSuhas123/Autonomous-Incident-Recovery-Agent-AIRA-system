kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: aira-reliability-lab

nodes:

  - role: control-plane

    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "aira.reliability-lab=true,aira.safety-class=LAB_ONLY,aira.phase=21"

    extraPortMappings:

      - containerPort: 30080
        hostPort: 18080
        protocol: TCP

      - containerPort: 30081
        hostPort: 18081
        protocol: TCP


  - role: worker

    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "aira.reliability-lab=true,aira.safety-class=LAB_ONLY,aira.phase=21"


  - role: worker

    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "aira.reliability-lab=true,aira.safety-class=LAB_ONLY,aira.phase=21"