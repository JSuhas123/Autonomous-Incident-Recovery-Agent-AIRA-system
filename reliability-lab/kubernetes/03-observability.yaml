apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: aira-reliability-lab

  labels:
    aira.reliability-lab: "true"
    aira.phase: "21"
    aira.safety-class: "LAB_ONLY"

data:

  prometheus.yml: |

    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:

      - job_name: aira-reliability-lab-api

        static_configs:

          - targets:
              - lab-api:8080

            labels:
              aira_reliability_lab: "true"
              aira_phase: "21"
              aira_safety_class: "LAB_ONLY"
              service_role: "api"


      - job_name: aira-reliability-lab-worker

        static_configs:

          - targets:
              - lab-worker:8081

            labels:
              aira_reliability_lab: "true"
              aira_phase: "21"
              aira_safety_class: "LAB_ONLY"
              service_role: "worker"


      - job_name: aira-reliability-lab-otel

        static_configs:

          - targets:
              - otel-collector:8889

            labels:
              aira_reliability_lab: "true"
              aira_phase: "21"
              aira_safety_class: "LAB_ONLY"


---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  namespace: aira-reliability-lab

  labels:
    app: prometheus
    aira.reliability-lab: "true"
    aira.phase: "21"
    aira.safety-class: "LAB_ONLY"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:

    metadata:

      labels:
        app: prometheus
        aira.reliability-lab: "true"
        aira.phase: "21"
        aira.safety-class: "LAB_ONLY"
        aira.resource-type: "observability.prometheus"

    spec:

      containers:

        - name: prometheus

          image: prom/prometheus:v3.5.0

          imagePullPolicy: IfNotPresent

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/tmp/prometheus
            - --storage.tsdb.retention.time=1h

          ports:

            - containerPort: 9090
              name: http

          readinessProbe:

            httpGet:
              path: /-/ready
              port: http

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20

          livenessProbe:

            httpGet:
              path: /-/healthy
              port: http

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          volumeMounts:

            - name: configuration
              mountPath: /etc/prometheus
              readOnly: true

          resources:

            requests:
              cpu: 25m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 256Mi

      volumes:

        - name: configuration

          configMap:
            name: prometheus-config


---

apiVersion: v1
kind: Service

metadata:
  name: prometheus
  namespace: aira-reliability-lab

  labels:
    app: prometheus
    aira.reliability-lab: "true"
    aira.phase: "21"
    aira.safety-class: "LAB_ONLY"

spec:

  selector:
    app: prometheus

  ports:

    - name: http
      port: 9090
      targetPort: http


---

apiVersion: v1
kind: ConfigMap

metadata:
  name: otel-collector-config
  namespace: aira-reliability-lab

  labels:
    aira.reliability-lab: "true"
    aira.phase: "21"
    aira.safety-class: "LAB_ONLY"

data:

  config.yaml: |

    receivers:

      otlp:

        protocols:

          grpc:
            endpoint: 0.0.0.0:4317

          http:
            endpoint: 0.0.0.0:4318


    processors:

      memory_limiter:
        check_interval: 1s
        limit_mib: 128
        spike_limit_mib: 32

      batch:
        timeout: 1s


    exporters:

      debug:
        verbosity: basic

      prometheus:
        endpoint: 0.0.0.0:8889


    extensions:

      health_check:
        endpoint: 0.0.0.0:13133


    service:

      extensions:
        - health_check

      pipelines:

        traces:

          receivers:
            - otlp

          processors:
            - memory_limiter
            - batch

          exporters:
            - debug


        metrics:

          receivers:
            - otlp

          processors:
            - memory_limiter
            - batch

          exporters:
            - prometheus
            - debug


        logs:

          receivers:
            - otlp

          processors:
            - memory_limiter
            - batch

          exporters:
            - debug


---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: otel-collector
  namespace: aira-reliability-lab

  labels:
    app: otel-collector
    aira.reliability-lab: "true"
    aira.phase: "21"
    aira.safety-class: "LAB_ONLY"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: otel-collector

  template:

    metadata:

      labels:
        app: otel-collector
        aira.reliability-lab: "true"
        aira.phase: "21"
        aira.safety-class: "LAB_ONLY"
        aira.resource-type: "observability.otel-collector"

    spec:

      containers:

        - name: otel-collector

          image: otel/opentelemetry-collector-contrib:0.133.0

          imagePullPolicy: IfNotPresent

          args:
            - --config=/etc/otelcol-contrib/config.yaml

          ports:

            - containerPort: 4317
              name: otlp-grpc

            - containerPort: 4318
              name: otlp-http

            - containerPort: 8889
              name: prometheus

            - containerPort: 13133
              name: health

          readinessProbe:

            httpGet:
              path: /
              port: health

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20

          livenessProbe:

            httpGet:
              path: /
              port: health

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          volumeMounts:

            - name: configuration
              mountPath: /etc/otelcol-contrib
              readOnly: true

          resources:

            requests:
              cpu: 25m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 256Mi

      volumes:

        - name: configuration

          configMap:
            name: otel-collector-config


---

apiVersion: v1
kind: Service

metadata:
  name: otel-collector
  namespace: aira-reliability-lab

  labels:
    app: otel-collector
    aira.reliability-lab: "true"
    aira.phase: "21"
    aira.safety-class: "LAB_ONLY"

spec:

  selector:
    app: otel-collector

  ports:

    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc

    - name: otlp-http
      port: 4318
      targetPort: otlp-http

    - name: prometheus
      port: 8889
      targetPort: prometheus

    - name: health
      port: 13133
      targetPort: health