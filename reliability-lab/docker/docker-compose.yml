name: aira-reliability-lab

services:

  postgres:
    image: postgres:16-alpine
    container_name: aira-lab-postgres

    environment:
      POSTGRES_DB: aira_lab
      POSTGRES_USER: aira_lab
      POSTGRES_PASSWORD: aira_lab_password

    ports:
      - "15433:5432"

    tmpfs:
      - /var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U aira_lab -d aira_lab"
        ]
      interval: 3s
      timeout: 3s
      retries: 20

    labels:
      aira.reliability-lab: "true"
      aira.phase: "21"
      aira.safety-class: "LAB_ONLY"
      aira.resource-type: "postgres.database"

    networks:
      - reliability-lab


  redis:
    image: redis:7-alpine
    container_name: aira-lab-redis

    ports:
      - "16380:6379"

    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no"
      ]

    tmpfs:
      - /data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 3s
      timeout: 3s
      retries: 20

    labels:
      aira.reliability-lab: "true"
      aira.phase: "21"
      aira.safety-class: "LAB_ONLY"
      aira.resource-type: "redis.instance"

    networks:
      - reliability-lab


  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aira-lab-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    ports:
      - "15673:5672"
      - "25673:15672"

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    labels:
      aira.reliability-lab: "true"
      aira.phase: "21"
      aira.safety-class: "LAB_ONLY"
      aira.resource-type: "rabbitmq.broker"

    networks:
      - reliability-lab


  lab-api:
    build:
      context: ../apps/fixture

    image: aira-reliability-fixture:21.6-v1
    container_name: aira-lab-api

    environment:
      SERVICE_ROLE: api
      PORT: 8080

      AIRA_LAB_ID: aira-reliability-lab
      AIRA_SAFETY_CLASS: LAB_ONLY

      POSTGRES_URL: postgresql://aira_lab:aira_lab_password@postgres:5432/aira_lab
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_QUEUE: aira.reliability.orders

    ports:
      - "18080:8080"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1:8080/ready"
        ]
      interval: 5s
      timeout: 4s
      retries: 20

    labels:
      aira.reliability-lab: "true"
      aira.phase: "21"
      aira.safety-class: "LAB_ONLY"
      aira.resource-type: "application.api"

    networks:
      - reliability-lab


  lab-worker:
    build:
      context: ../apps/fixture

    image: aira-reliability-fixture:21.6-v1
    container_name: aira-lab-worker

    environment:
      SERVICE_ROLE: worker
      PORT: 8081

      AIRA_LAB_ID: aira-reliability-lab
      AIRA_SAFETY_CLASS: LAB_ONLY

      POSTGRES_URL: postgresql://aira_lab:aira_lab_password@postgres:5432/aira_lab
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_QUEUE: aira.reliability.orders

    ports:
      - "18081:8081"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      lab-api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1:8081/ready"
        ]
      interval: 5s
      timeout: 4s
      retries: 20

    labels:
      aira.reliability-lab: "true"
      aira.phase: "21"
      aira.safety-class: "LAB_ONLY"
      aira.resource-type: "application.worker"

    networks:
      - reliability-lab


  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    container_name: aira-lab-otel-collector

    command:
      [
        "--config=/etc/otelcol-contrib/config.yaml"
      ]

    volumes:
      - ../observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro

    ports:
      - "14317:4317"
      - "14318:4318"
      - "18889:8889"
      - "13134:13133"

    healthcheck:
      test:
        [
          "CMD",
          "/otelcol-contrib",
          "--version"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    labels:
      aira.reliability-lab: "true"
      aira.phase: "21"
      aira.safety-class: "LAB_ONLY"
      aira.resource-type: "observability.otel-collector"

    networks:
      - reliability-lab


  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: aira-lab-prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/tmp/prometheus"
      - "--storage.tsdb.retention.time=1h"

    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "19090:9090"

    depends_on:
      lab-api:
        condition: service_healthy

      lab-worker:
        condition: service_healthy

      otel-collector:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1:9090/-/ready"
        ]
      interval: 5s
      timeout: 4s
      retries: 20

    labels:
      aira.reliability-lab: "true"
      aira.phase: "21"
      aira.safety-class: "LAB_ONLY"
      aira.resource-type: "observability.prometheus"

    networks:
      - reliability-lab


networks:

  reliability-lab:
    name: aira-reliability-lab

    driver: bridge

    labels:
      aira.reliability-lab: "true"
      aira.phase: "21"
      aira.safety-class: "LAB_ONLY"