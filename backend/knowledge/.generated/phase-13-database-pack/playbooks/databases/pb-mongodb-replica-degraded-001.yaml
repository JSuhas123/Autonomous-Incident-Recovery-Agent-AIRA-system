apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-MONGODB-REPLICA-DEGRADED-001
semver: 1.0.0
name: MongoDB Replica Set Degradation Investigation
description: Investigates MongoDB replica-set degradation without changing replica membership or election state.
lifecycle: DRAFT
owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Database Reliability
  team: database-reliability
scope:
  environments:
    - production
    - staging
  services:
    - database
incident:
  types:
    - MongoReplicaSetDegraded
    - MongoReplicationFailure
    - mongodb.replica.degraded
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - mongodb
    - mongo
  environments:
    - production
    - staging
requiredEvidence:
  - resource.targetId
conditions:
  minimumConfidence: 0.75
risk:
  level: LOW
  blastRadius: database-target
  reversible: true
policy:
  required: true
approval:
  mode: MANUAL
stages:
  - id: investigate-replica-set
    order: 1
    name: Investigate MongoDB Replica Set
    type: INVESTIGATION
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-MONGODB-INVESTIGATE-REPLICA-SET
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
  - id: verify-mongo-health
    order: 2
    name: Verify MongoDB Health
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-MONGODB-INVESTIGATE-HEALTH
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
rollback:
  strategy: NONE
escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: dba-oncall
outcome:
  captureLearning: true
  updateIncidentMemory: true
tags:
  - database
  - diagnostic
  - phase-13
