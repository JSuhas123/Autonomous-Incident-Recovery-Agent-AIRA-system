apiVersion: aira.io/v1
kind: Runbook
runbookId: RB-MONGODB-INVESTIGATE-HEALTH
semver: 1.0.0
name: MongoDB Health Investigation
description: Inspects an external MongoDB target server status without using or modifying AIRA internal MongoDB.
lifecycle: ACTIVE
owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Database Reliability
  team: database-reliability
scope:
  environments:
    - production
    - staging
  services:
    - database
risk:
  level: LOW
  blastRadius: none
  reversible: true
parameters:
  - name: targetId
    type: string
    required: true
    description: Identifier of an explicitly registered external database diagnostic target.
steps:
  - id: step-01
    name: Read MongoDB server status
    order: 1
    type: mongodb
    action: get_server_status
    params:
      targetId: ${targetId}
    failurePolicy: STOP
  - id: step-02
    name: Check database connectivity
    order: 2
    type: database
    action: check_connectivity
    params:
      targetId: ${targetId}
    failurePolicy: CONTINUE
verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: MongoDB Health Investigation completed and returned diagnostic evidence.
      timeoutSeconds: 30
      optional: false
rollbackConfig:
  strategy: NONE
auditConfig:
  redactSensitiveValues: true
tags:
  - database
  - diagnostic
  - read-only
  - phase-13
