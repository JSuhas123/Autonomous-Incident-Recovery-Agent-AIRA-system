apiVersion: aira.io/v1
kind: Runbook
runbookId: RB-DB-INVESTIGATE-LOCKS
semver: 1.0.0
name: Database Lock Contention Investigation
description: Inspects database lock and blocking relationships without killing blocking sessions.
lifecycle: ACTIVE
owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Database Reliability
  team: database-reliability
scope:
  environments:
    - production
    - staging
  services:
    - database
risk:
  level: LOW
  blastRadius: none
  reversible: true
parameters:
  - name: targetId
    type: string
    required: true
    description: Identifier of an explicitly registered external database diagnostic target.
steps:
  - id: step-01
    name: Inspect locks
    order: 1
    type: database
    action: get_locks
    params:
      targetId: ${targetId}
    failurePolicy: STOP
  - id: step-02
    name: Inspect long transactions
    order: 2
    type: database
    action: get_long_transactions
    params:
      targetId: ${targetId}
    failurePolicy: CONTINUE
  - id: step-03
    name: Check deadlocks
    order: 3
    type: database
    action: check_deadlocks
    params:
      targetId: ${targetId}
    failurePolicy: CONTINUE
verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Database Lock Contention Investigation completed and returned diagnostic evidence.
      timeoutSeconds: 30
      optional: false
rollbackConfig:
  strategy: NONE
auditConfig:
  redactSensitiveValues: true
tags:
  - database
  - diagnostic
  - read-only
  - phase-13
