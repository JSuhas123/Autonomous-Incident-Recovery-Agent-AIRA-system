apiVersion: aira.io/v1
kind: Runbook
runbookId: RB-DB-CHECK-CONNECTIVITY
semver: 1.0.0
name: Database Connectivity Check
description: Read-only connectivity assessment for an explicitly registered external database target.
lifecycle: ACTIVE
owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Database Reliability
  team: database-reliability
scope:
  environments:
    - production
    - staging
  services:
    - database
risk:
  level: LOW
  blastRadius: none
  reversible: true
parameters:
  - name: targetId
    type: string
    required: true
    description: Identifier of an explicitly registered external database diagnostic target.
steps:
  - id: step-01
    name: Check database connectivity
    order: 1
    type: database
    action: check_connectivity
    params:
      targetId: ${targetId}
    failurePolicy: STOP
verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Database Connectivity Check completed and returned diagnostic evidence.
      timeoutSeconds: 30
      optional: false
rollbackConfig:
  strategy: NONE
auditConfig:
  redactSensitiveValues: true
tags:
  - database
  - diagnostic
  - read-only
  - phase-13
