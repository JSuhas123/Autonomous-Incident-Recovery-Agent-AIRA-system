apiVersion: aira.io/v1
kind: Runbook
runbookId: RB-K8S-INVESTIGATE-PVC
name: Kubernetes PersistentVolumeClaim Investigation
description: >-
  Read-only investigation of a Kubernetes PersistentVolumeClaim that is Pending, Lost, unbound, or
  otherwise unhealthy.
semver: 1.0.0
lifecycle: ACTIVE
owner:
  ownerType: system
  name: Platform Engineering
scope:
  environments:
    - production
    - staging
    - dev
  providers:
    - kubernetes
risk:
  level: LOW
  blastRadius: none
  reversible: true
parameters:
  - name: pvc
    type: string
    required: true
    description: Name of the affected PersistentVolumeClaim.
  - name: namespace
    type: string
    required: true
    description: Namespace containing the PersistentVolumeClaim.
steps:
  - id: step-01
    name: Get PersistentVolumeClaim state
    order: 1
    type: kubernetes
    action: get_pvc
    params:
      resource: ${pvc}
      namespace: ${namespace}
    failurePolicy: STOP
  - id: step-02
    name: Check PersistentVolumeClaim binding
    order: 2
    type: kubernetes
    action: check_pvc_bound
    params:
      resource: ${pvc}
      namespace: ${namespace}
    failurePolicy: CONTINUE
rollbackConfig:
  strategy: NONE
  nonReversibleAcknowledged: false
verification:
  strategy: ANY
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: pvc_bound
      description: Capture whether the PersistentVolumeClaim is currently Bound.
      params:
        pvc: ${pvc}
        namespace: ${namespace}
      timeoutSeconds: 30
      optional: true
auditConfig:
  redactSensitiveValues: false
