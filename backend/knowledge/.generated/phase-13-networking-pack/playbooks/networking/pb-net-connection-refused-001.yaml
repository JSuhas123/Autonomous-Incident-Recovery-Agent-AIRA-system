apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-NET-CONNECTION-REFUSED-001
semver: 1.0.0
name: Network Connection Refused Investigation
description: Investigates connection-refused failures using connectivity, port and upstream diagnostics.
lifecycle: DRAFT
owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Networking Reliability
  team: networking-reliability
scope:
  environments:
    - production
    - staging
  services:
    - networking
incident:
  types:
    - ConnectionRefused
    - NetworkConnectionRefused
    - network.connection.refused
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - networking
  environments:
    - production
    - staging
requiredEvidence:
  - resource.targetId
conditions:
  minimumConfidence: 0.75
risk:
  level: LOW
  blastRadius: network-target
  reversible: true
policy:
  required: true
approval:
  mode: MANUAL
stages:
  - id: investigate-refusal
    order: 1
    name: Investigate Connection Refusal
    type: INVESTIGATION
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-NET-INVESTIGATE-CONNECTIVITY
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
      - runbookId: RB-NET-INVESTIGATE-PORT
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
      - runbookId: RB-NET-INVESTIGATE-UPSTREAM
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
  - id: verify-port
    order: 2
    name: Verify Port Reachability
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-NET-VERIFY-PORT
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
rollback:
  strategy: NONE
escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: network-oncall
outcome:
  captureLearning: true
  updateIncidentMemory: true
tags:
  - networking
  - diagnostic
  - phase-13
