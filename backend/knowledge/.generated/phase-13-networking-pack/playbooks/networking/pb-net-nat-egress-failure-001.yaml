apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-NET-NAT-EGRESS-FAILURE-001
semver: 1.0.0
name: NAT and Network Egress Failure Investigation
description: Investigates outbound connectivity failures using egress, DNS and routing diagnostics.
lifecycle: DRAFT
owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Networking Reliability
  team: networking-reliability
scope:
  environments:
    - production
    - staging
  services:
    - networking
incident:
  types:
    - NetworkEgressFailure
    - NATGatewayFailure
    - network.egress.failure
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - networking
    - cloud-networking
  environments:
    - production
    - staging
requiredEvidence:
  - resource.targetId
conditions:
  minimumConfidence: 0.75
risk:
  level: LOW
  blastRadius: network-target
  reversible: true
policy:
  required: true
approval:
  mode: MANUAL
stages:
  - id: investigate-egress
    order: 1
    name: Investigate Network Egress
    type: INVESTIGATION
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-NET-INVESTIGATE-EGRESS
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
      - runbookId: RB-NET-INVESTIGATE-DNS
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
      - runbookId: RB-NET-INVESTIGATE-ROUTE
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
  - id: verify-egress
    order: 2
    name: Verify Network Egress
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-NET-VERIFY-EGRESS
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
rollback:
  strategy: NONE
escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: network-oncall
outcome:
  captureLearning: true
  updateIncidentMemory: true
tags:
  - networking
  - diagnostic
  - phase-13
