apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-NET-SERVICE-UNREACHABLE-001
semver: 1.0.0
name: Network Service Unreachable Investigation
description: Investigates an unreachable service using connectivity, DNS, port and verification diagnostics.
lifecycle: DRAFT
owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Networking Reliability
  team: networking-reliability
scope:
  environments:
    - production
    - staging
  services:
    - networking
incident:
  types:
    - ServiceUnreachable
    - NetworkServiceUnavailable
    - network.service.unreachable
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - networking
    - network
  environments:
    - production
    - staging
requiredEvidence:
  - resource.targetId
conditions:
  minimumConfidence: 0.75
risk:
  level: LOW
  blastRadius: network-target
  reversible: true
policy:
  required: true
approval:
  mode: MANUAL
stages:
  - id: investigate-connectivity
    order: 1
    name: Investigate Connectivity
    type: INVESTIGATION
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-NET-INVESTIGATE-CONNECTIVITY
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
      - runbookId: RB-NET-INVESTIGATE-DNS
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
      - runbookId: RB-NET-INVESTIGATE-PORT
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
  - id: verify-connectivity
    order: 2
    name: Verify Connectivity
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-NET-VERIFY-CONNECTIVITY
        required: true
        parameterMappings:
          targetId: ${incident.resource.targetId}
rollback:
  strategy: NONE
escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: network-oncall
outcome:
  captureLearning: true
  updateIncidentMemory: true
tags:
  - networking
  - diagnostic
  - phase-13
