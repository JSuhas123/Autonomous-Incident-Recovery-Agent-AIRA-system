apiVersion: aira.io/v1
kind: Runbook
runbookId: RB-NET-INVESTIGATE-EGRESS
semver: 1.0.0
name: Network Egress Investigation
description: Investigates outbound connectivity, routing, and DNS without modifying NAT or firewall state.
lifecycle: ACTIVE
owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Networking Reliability
  team: networking-reliability
scope:
  environments:
    - production
    - staging
  services:
    - networking
risk:
  level: LOW
  blastRadius: none
  reversible: true
parameters:
  - name: targetId
    type: string
    required: true
    description: Identifier of an explicitly registered external network diagnostic target.
steps:
  - id: step-01
    name: Check network egress
    order: 1
    type: networking
    action: check_egress
    params:
      targetId: ${targetId}
    failurePolicy: STOP
  - id: step-02
    name: Check DNS resolution
    order: 2
    type: networking
    action: check_dns
    params:
      targetId: ${targetId}
    failurePolicy: CONTINUE
  - id: step-03
    name: Inspect route
    order: 3
    type: networking
    action: check_route
    params:
      targetId: ${targetId}
    failurePolicy: CONTINUE
verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Network Egress Investigation completed and returned diagnostic evidence.
      timeoutSeconds: 30
      optional: false
rollbackConfig:
  strategy: NONE
auditConfig:
  redactSensitiveValues: true
tags:
  - networking
  - diagnostic
  - read-only
  - phase-13
