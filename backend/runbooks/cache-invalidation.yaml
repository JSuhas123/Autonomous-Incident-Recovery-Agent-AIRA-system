id: cache-invalidation
name: "Cache Invalidation"
description: "Invalidate application caches to resolve stale data issues"
severity: medium
services:
  - cache
  - redis
  - memcached
estimatedDuration: 120

triggers:
  - type: metric
    condition: "cache.staleness_ratio > 0.2"
  - type: alert
    name: "Stale cache detected"
  - type: manual
    name: "Manual cache clear"

preconditions:
  - check: "Cache server is reachable"
    command: "redis-cli ping"

steps:
  - step: 1
    name: "Identify stale cache keys"
    action: "query"
    query: "Analyze cache hit rate and staleness metrics"

  - step: 2
    name: "Selective cache invalidation"
    action: "command"
    command: "redis-cli KEYS '{{pattern}}' | xargs redis-cli DEL"
    condition: "pattern_specified == true"
    confirmation: true

  - step: 3
    name: "Full cache flush (if necessary)"
    action: "command"
    command: "redis-cli FLUSHALL"
    condition: "full_flush_required == true"
    confirmation: true
    rollback: "redis-cli --rdb /backup/redis-backup.rdb"

  - step: 4
    name: "Refill critical cache entries"
    action: "command"
    command: "curl -X POST http://{{api_host}}/admin/cache/warm"

  - step: 5
    name: "Monitor cache performance"
    action: "query"
    query: "SELECT hit_rate, miss_rate FROM cache_metrics WHERE timestamp > now() - interval '5 minutes'"
    successCriteria: "hit_rate > 0.75"
    timeout: 300

postconditions:
  - check: "Cache is responsive"
    command: "redis-cli --latency-history"
  - check: "Cache hit rate recovered"
    command: "redis-cli info stats | grep hit_rate"

notificationChannels:
  - slack

metadata:
  owner: "Backend Team"
  createdAt: "2026-03-26"
  successRate: 0.99
  executionCount: 156
