apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-MSG-CHECK-REPLICATION-HEALTH
semver: "1.0.0"

name: Messaging Replication Health Investigation

description: >
  Inspects Kafka or compatible broker replication health and replica
  availability without changing replica assignments or replication factors.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Messaging Reliability
  team: messaging-reliability

scope:
  environments:
    - production
    - staging
  services:
    - messaging
    - replication

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered messaging diagnostic target identifier.

steps:
  - id: step-01
    name: Check Replication Health
    order: 1
    type: messaging
    action: check_replication_health
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Broker-replication evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - messaging
  - kafka
  - replication
  - diagnostic
  - read-only