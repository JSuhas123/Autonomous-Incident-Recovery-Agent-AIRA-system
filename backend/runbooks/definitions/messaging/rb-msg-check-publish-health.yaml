apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-MSG-CHECK-PUBLISH-HEALTH
semver: "1.0.0"

name: Message Publish Path Investigation

description: >
  Inspects message publishing health between producers and the message broker
  without producing synthetic messages or changing publisher configuration.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Messaging Reliability
  team: messaging-reliability

scope:
  environments:
    - production
    - staging
  services:
    - messaging
    - producer

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered messaging diagnostic target identifier.

steps:
  - id: step-01
    name: Check Publish Health
    order: 1
    type: messaging
    action: check_publish_health
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Publish-path evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - messaging
  - producer
  - publish
  - diagnostic
  - read-only