apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-MSG-CHECK-CONSUMER-LAG
semver: "1.0.0"

name: Consumer Lag Investigation

description: >
  Inspects consumer lag, delayed offsets and message-processing backlog
  without resetting offsets or restarting consumers.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Messaging Reliability
  team: messaging-reliability

scope:
  environments:
    - production
    - staging
  services:
    - messaging
    - consumers

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered messaging diagnostic target identifier.

steps:
  - id: step-01
    name: Check Consumer Lag
    order: 1
    type: messaging
    action: check_consumer_lag
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Consumer-lag evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - messaging
  - consumer
  - lag
  - kafka
  - diagnostic