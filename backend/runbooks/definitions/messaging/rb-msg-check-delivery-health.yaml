apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-MSG-CHECK-DELIVERY-HEALTH
semver: "1.0.0"

name: Message Delivery Health Investigation

description: >
  Inspects message delivery, acknowledgement and redelivery conditions
  without acknowledging, rejecting, replaying or deleting messages.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Messaging Reliability
  team: messaging-reliability

scope:
  environments:
    - production
    - staging
  services:
    - messaging
    - delivery

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered messaging diagnostic target identifier.

steps:
  - id: step-01
    name: Check Message Delivery Health
    order: 1
    type: messaging
    action: check_delivery_health
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Message-delivery evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - messaging
  - delivery
  - acknowledgement
  - diagnostic
  - read-only