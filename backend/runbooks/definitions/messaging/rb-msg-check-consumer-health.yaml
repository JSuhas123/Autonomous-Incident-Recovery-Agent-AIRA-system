apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-MSG-CHECK-CONSUMER-HEALTH
semver: "1.0.0"

name: Message Consumer Health Investigation

description: >
  Inspects the health of registered message consumers without restarting,
  scaling or modifying consumer workloads.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Messaging Reliability
  team: messaging-reliability

scope:
  environments:
    - production
    - staging
  services:
    - messaging
    - consumers

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered messaging diagnostic target identifier.

steps:
  - id: step-01
    name: Check Consumer Health
    order: 1
    type: messaging
    action: check_consumer_health
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Consumer-health evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - messaging
  - consumer
  - health
  - diagnostic
  - read-only