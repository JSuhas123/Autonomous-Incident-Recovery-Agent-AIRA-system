apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-MSG-CHECK-BROKER-HEALTH
semver: "1.0.0"

name: Messaging Broker Health Check

description: >
  Performs a deterministic read-only health assessment of a registered
  RabbitMQ, Kafka or compatible message broker without restarting or
  reconfiguring the broker.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Messaging Reliability
  team: messaging-reliability

scope:
  environments:
    - production
    - staging
  services:
    - messaging

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered messaging diagnostic target identifier.

steps:
  - id: step-01
    name: Check Broker Health
    order: 1
    type: messaging
    action: check_broker_health
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Broker-health evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - messaging
  - broker
  - rabbitmq
  - kafka
  - diagnostic
  - read-only