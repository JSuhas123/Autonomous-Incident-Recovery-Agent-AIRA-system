apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-MSG-CHECK-PARTITION-HEALTH
semver: "1.0.0"

name: Kafka Partition Health Investigation

description: >
  Inspects Kafka partition leadership, availability and partition health
  without reassigning partitions or electing leaders.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Messaging Reliability
  team: messaging-reliability

scope:
  environments:
    - production
    - staging
  services:
    - messaging
    - kafka

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered messaging diagnostic target identifier.

steps:
  - id: step-01
    name: Check Kafka Partition Health
    order: 1
    type: messaging
    action: check_partition_health
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Kafka partition-health evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - messaging
  - kafka
  - partition
  - diagnostic
  - read-only