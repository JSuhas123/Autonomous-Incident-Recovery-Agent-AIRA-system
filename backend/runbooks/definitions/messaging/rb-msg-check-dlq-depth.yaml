apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-MSG-CHECK-DLQ-DEPTH
semver: "1.0.0"

name: Dead Letter Queue Investigation

description: >
  Inspects dead-letter queue depth and accumulation state without replaying,
  deleting or modifying dead-lettered messages.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Messaging Reliability
  team: messaging-reliability

scope:
  environments:
    - production
    - staging
  services:
    - messaging
    - dlq

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered messaging diagnostic target identifier.

steps:
  - id: step-01
    name: Check Dead Letter Queue Depth
    order: 1
    type: messaging
    action: check_dlq_depth
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Dead-letter queue evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - messaging
  - dlq
  - dead-letter
  - diagnostic
  - read-only