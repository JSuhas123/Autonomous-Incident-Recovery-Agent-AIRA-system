apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-MSG-CHECK-CONNECTION-HEALTH
semver: "1.0.0"

name: Broker Connection Health Investigation

description: >
  Inspects client-to-broker connection health and connectivity conditions
  without reconnecting clients or changing broker connection configuration.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Messaging Reliability
  team: messaging-reliability

scope:
  environments:
    - production
    - staging
  services:
    - messaging
    - connectivity

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered messaging diagnostic target identifier.

steps:
  - id: step-01
    name: Check Broker Connection Health
    order: 1
    type: messaging
    action: check_connection_health
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Broker-connection evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - messaging
  - connection
  - broker
  - diagnostic
  - read-only