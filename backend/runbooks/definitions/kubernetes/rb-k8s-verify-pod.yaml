apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-K8S-VERIFY-POD
name: Kubernetes Pod Verification
description: >
  Read-only verification that a Kubernetes pod is running, ready, and stable.
  Checks phase, readiness condition, and optionally restart-count stability.
  Used after pod restart to confirm recovery.
semver: 1.0.0
lifecycle: ACTIVE

owner:
  ownerType: system
  name: Platform Engineering

scope:
  environments:
    - production
    - staging
    - dev
  providers:
    - kubernetes

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: pod
    type: string
    required: true
    description: Exact name of the pod to verify.
  - name: namespace
    type: string
    required: true
    description: Kubernetes namespace containing the pod.

steps:
  - id: step-01
    name: Check pod readiness
    order: 1
    type: kubernetes
    action: check_pod_ready
    params:
      pod: ${pod}
      namespace: ${namespace}
    timeoutSeconds: 120
    failurePolicy: STOP

rollbackConfig:
  strategy: NONE
  nonReversibleAcknowledged: false

verification:
  strategy: ALL
  timeoutSeconds: 120
  checks:
    - id: check-01
      type: pod_running
      description: Pod must be in Running phase and ready
      params:
        pod: ${pod}
        namespace: ${namespace}
      timeoutSeconds: 120

auditConfig:
  redactSensitiveValues: false
