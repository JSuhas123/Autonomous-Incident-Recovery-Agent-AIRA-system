apiVersion: aira.io/v1
kind: Runbook
runbookId: RB-K8S-VERIFY-INGRESS
name: Kubernetes Ingress Configuration Verification
description: >-
  Read-only verification that a Kubernetes Ingress retains usable routing configuration after
  investigation or recovery.
semver: 1.0.0
lifecycle: ACTIVE
owner:
  ownerType: system
  name: Platform Engineering
scope:
  environments:
    - production
    - staging
    - dev
  providers:
    - kubernetes
risk:
  level: LOW
  blastRadius: none
  reversible: true
parameters:
  - name: ingress
    type: string
    required: true
    description: Kubernetes Ingress to verify.
  - name: namespace
    type: string
    required: true
    description: Namespace containing the Ingress.
steps:
  - id: step-01
    name: Check Ingress routing configuration
    order: 1
    type: kubernetes
    action: check_ingress
    params:
      resource: ${ingress}
      namespace: ${namespace}
    failurePolicy: STOP
  - id: step-02
    name: Collect final Ingress state
    order: 2
    type: kubernetes
    action: get_ingress
    params:
      resource: ${ingress}
      namespace: ${namespace}
    failurePolicy: CONTINUE
rollbackConfig:
  strategy: NONE
  nonReversibleAcknowledged: false
verification:
  strategy: ALL
  timeoutSeconds: 60
  checks:
    - id: check-01
      type: ingress_configured
      description: Ingress must retain usable routing configuration.
      params:
        ingress: ${ingress}
        namespace: ${namespace}
      timeoutSeconds: 60
auditConfig:
  redactSensitiveValues: false
