apiVersion: aira.io/v1
kind: Runbook
runbookId: RB-CONTAINER-CHECK-RUNTIME-HEALTH
semver: "1.0.0"
name: Check Container Runtime Health
description: Inspect Docker, containerd or compatible runtime health.
lifecycle: DRAFT
owner:
  ownerType: system
  name: AIRA Container Reliability
  team: platform-reliability
execution:
  mode: OBSERVE
risk:
  level: LOW
  blastRadius: none
  reversible: true
parameters:
  required: [targetId]
steps:
  - id: check-runtime-health
    order: 1
    type: containers
    action: check_runtime_health
    parameters:
      targetId: "${parameters.targetId}"
verification:
  required: false
rollback:
  supported: false
tags: [containers, runtime, diagnostic]