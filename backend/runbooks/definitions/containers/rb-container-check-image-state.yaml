apiVersion: aira.io/v1
kind: Runbook
runbookId: RB-CONTAINER-CHECK-IMAGE-STATE
semver: "1.0.0"
name: Check Container Image State
description: Inspect runtime image availability and image state.
lifecycle: DRAFT
owner:
  ownerType: system
  name: AIRA Container Reliability
  team: platform-reliability
execution:
  mode: OBSERVE
risk:
  level: LOW
  blastRadius: none
  reversible: true
parameters:
  required: [targetId]
steps:
  - id: check-image-state
    order: 1
    type: containers
    action: check_image_state
    parameters:
      targetId: "${parameters.targetId}"
verification:
  required: false
rollback:
  supported: false
tags: [containers, image, diagnostic]