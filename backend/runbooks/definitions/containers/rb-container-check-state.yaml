apiVersion: aira.io/v1
kind: Runbook
runbookId: RB-CONTAINER-CHECK-STATE
semver: "1.0.0"
name: Check Container State
description: Inspect container lifecycle and runtime state.
lifecycle: DRAFT
owner:
  ownerType: system
  name: AIRA Container Reliability
  team: platform-reliability
execution:
  mode: OBSERVE
risk:
  level: LOW
  blastRadius: none
  reversible: true
parameters:
  required:
    - targetId
steps:
  - id: check-container-state
    order: 1
    type: containers
    action: check_container_state
    parameters:
      targetId: "${parameters.targetId}"
verification:
  required: false
rollback:
  supported: false
tags: [containers, state, diagnostic]