apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-OBS-CHECK-TELEMETRY-FRESHNESS
semver: "1.0.0"

name: Telemetry Freshness Investigation

description: >
  Determines whether expected telemetry has stopped arriving or become stale
  without modifying telemetry retention, timestamps or stored data.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - telemetry

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered observability diagnostic target identifier.

steps:
  - id: step-01
    name: Check Telemetry Freshness
    order: 1
    type: observability
    action: check_telemetry_freshness
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Telemetry-freshness evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - observability
  - telemetry
  - stale-data
  - freshness
  - diagnostic