apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-OBS-CHECK-TRACES-FLOW
semver: "1.0.0"

name: Trace Flow Investigation

description: >
  Determines whether distributed trace telemetry is flowing correctly through
  collection, export and ingestion components.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - tracing

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered observability diagnostic target identifier.

steps:
  - id: step-01
    name: Check Trace Flow
    order: 1
    type: observability
    action: check_traces_flow
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Trace-flow evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - observability
  - traces
  - telemetry
  - diagnostic
  - read-only