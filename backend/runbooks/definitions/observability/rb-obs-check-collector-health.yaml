apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-OBS-CHECK-COLLECTOR-HEALTH
semver: "1.0.0"

name: Telemetry Collector Health Investigation

description: >
  Inspects the health of an OpenTelemetry Collector, Prometheus agent,
  Fluent Bit, Fluentd or equivalent registered telemetry collector without
  restarting or reconfiguring it.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - telemetry-collector

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered observability diagnostic target identifier.

steps:
  - id: step-01
    name: Check Telemetry Collector Health
    order: 1
    type: observability
    action: check_collector_health
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Collector-health evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - observability
  - collector
  - opentelemetry
  - diagnostic
  - read-only