apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-OBS-CHECK-EXPORTER-HEALTH
semver: "1.0.0"

name: Telemetry Exporter Health Investigation

description: >
  Inspects telemetry exporter health and downstream delivery state without
  restarting exporters or changing endpoint configuration.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - telemetry-exporter

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered observability diagnostic target identifier.

steps:
  - id: step-01
    name: Check Telemetry Exporter Health
    order: 1
    type: observability
    action: check_exporter_health
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Exporter-health evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - observability
  - exporter
  - telemetry
  - diagnostic
  - read-only