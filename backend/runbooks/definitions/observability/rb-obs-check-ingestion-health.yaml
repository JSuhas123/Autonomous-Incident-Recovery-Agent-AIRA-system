apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-OBS-CHECK-INGESTION-HEALTH
semver: "1.0.0"

name: Telemetry Ingestion Health Investigation

description: >
  Inspects downstream telemetry ingestion health and detects rejected,
  delayed or unavailable ingestion paths without mutating the backend.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - ingestion

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered observability diagnostic target identifier.

steps:
  - id: step-01
    name: Check Telemetry Ingestion Health
    order: 1
    type: observability
    action: check_ingestion_health
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Telemetry-ingestion evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - observability
  - ingestion
  - telemetry
  - diagnostic
  - read-only