apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-OBS-CHECK-METRICS-FLOW
semver: "1.0.0"

name: Metrics Flow Investigation

description: >
  Checks whether metrics telemetry is being produced, transported and received
  by the configured observability destination. This runbook performs no
  configuration or telemetry mutation.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - metrics

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered observability diagnostic target identifier.

steps:
  - id: step-01
    name: Check Metrics Flow
    order: 1
    type: observability
    action: check_metrics_flow
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Metrics-flow evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - observability
  - metrics
  - telemetry
  - diagnostic
  - read-only