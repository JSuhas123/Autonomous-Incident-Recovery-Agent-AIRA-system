apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-OBS-CHECK-TARGET-HEALTH
semver: "1.0.0"

name: Observability Target Health Check

description: >
  Performs a deterministic read-only health assessment of a registered
  observability backend or telemetry endpoint. The runbook does not restart,
  reconfigure, or mutate the target.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered observability diagnostic target identifier.

steps:
  - id: step-01
    name: Check Observability Target Health
    order: 1
    type: observability
    action: check_target_health
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Observability target health evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - observability
  - health
  - diagnostic
  - read-only
  - phase-13