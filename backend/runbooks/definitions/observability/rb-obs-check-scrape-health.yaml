apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-OBS-CHECK-SCRAPE-HEALTH
semver: "1.0.0"

name: Metrics Scrape Health Investigation

description: >
  Inspects metrics scrape health and target availability for Prometheus-style
  monitoring systems without modifying scrape configuration.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - metrics

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered observability diagnostic target identifier.

steps:
  - id: step-01
    name: Check Scrape Health
    order: 1
    type: observability
    action: check_scrape_health
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Metrics scrape-health evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - observability
  - prometheus
  - scrape
  - metrics
  - diagnostic
  