apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-OBS-CHECK-ALERT-PIPELINE
semver: "1.0.0"

name: Alert Pipeline Health Investigation

description: >
  Inspects alert evaluation, processing and routing pipeline health without
  modifying alert rules, silences, receivers or routing configuration.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - alerting

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered observability diagnostic target identifier.

steps:
  - id: step-01
    name: Check Alert Pipeline
    order: 1
    type: observability
    action: check_alert_pipeline
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Alert-pipeline evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - observability
  - alertmanager
  - alerting
  - diagnostic
  - read-only