apiVersion: aira.io/v1
kind: Runbook

runbookId: RB-OBS-CHECK-CARDINALITY
semver: "1.0.0"

name: Metrics Cardinality Investigation

description: >
  Inspects metrics cardinality and series-growth conditions to identify
  excessive label combinations or cardinality pressure without deleting or
  modifying metric series.

lifecycle: ACTIVE

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - metrics

risk:
  level: LOW
  blastRadius: none
  reversible: true

parameters:
  - name: targetId
    type: string
    required: true
    description: Registered observability diagnostic target identifier.

steps:
  - id: step-01
    name: Check Metrics Cardinality
    order: 1
    type: observability
    action: check_cardinality
    params:
      targetId: "${targetId}"
    failurePolicy: STOP

verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Metrics-cardinality evidence was collected.
      timeoutSeconds: 30
      optional: false

rollbackConfig:
  strategy: NONE

auditConfig:
  redactSensitiveValues: true

tags:
  - observability
  - prometheus
  - metrics
  - cardinality
  - diagnostic
  - read-only