apiVersion: aira.io/v1
kind: Runbook
runbookId: RB-REDIS-INVESTIGATE-REPLICATION
semver: 1.0.0
name: Redis Replication Investigation
description: Inspects Redis replication state without promotion, failover, or topology mutation.
lifecycle: ACTIVE
owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Database Reliability
  team: database-reliability
scope:
  environments:
    - production
    - staging
  services:
    - database
risk:
  level: LOW
  blastRadius: none
  reversible: true
parameters:
  - name: targetId
    type: string
    required: true
    description: Identifier of an explicitly registered external database diagnostic target.
steps:
  - id: step-01
    name: Inspect Redis replication
    order: 1
    type: redis
    action: get_replication
    params:
      targetId: ${targetId}
    failurePolicy: STOP
  - id: step-02
    name: Read Redis operational information
    order: 2
    type: redis
    action: get_info
    params:
      targetId: ${targetId}
    failurePolicy: CONTINUE
verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Redis Replication Investigation completed and returned diagnostic evidence.
      timeoutSeconds: 30
      optional: false
rollbackConfig:
  strategy: NONE
auditConfig:
  redactSensitiveValues: true
tags:
  - database
  - diagnostic
  - read-only
  - phase-13
