apiVersion: aira.io/v1
kind: Runbook
runbookId: RB-DB-VERIFY-CONNECTION-POOL
semver: 1.0.0
name: Database Connection Pool Verification
description: Verifies whether database connection-pool utilization is currently within healthy limits.
lifecycle: ACTIVE
owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Database Reliability
  team: database-reliability
scope:
  environments:
    - production
    - staging
  services:
    - database
risk:
  level: LOW
  blastRadius: none
  reversible: true
parameters:
  - name: targetId
    type: string
    required: true
    description: Identifier of an explicitly registered external database diagnostic target.
steps:
  - id: step-01
    name: Check connection pool
    order: 1
    type: database
    action: check_connection_pool
    params:
      targetId: ${targetId}
    failurePolicy: STOP
  - id: step-02
    name: Inspect active connections
    order: 2
    type: database
    action: get_connections
    params:
      targetId: ${targetId}
    failurePolicy: CONTINUE
verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Database Connection Pool Verification completed and returned diagnostic evidence.
      timeoutSeconds: 30
      optional: false
rollbackConfig:
  strategy: NONE
auditConfig:
  redactSensitiveValues: true
tags:
  - database
  - diagnostic
  - read-only
  - phase-13
