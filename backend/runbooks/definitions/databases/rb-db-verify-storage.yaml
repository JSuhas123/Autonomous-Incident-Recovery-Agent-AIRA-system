apiVersion: aira.io/v1
kind: Runbook
runbookId: RB-DB-VERIFY-STORAGE
semver: 1.0.0
name: Database Storage Verification
description: Verifies database storage pressure and current capacity using read-only diagnostics.
lifecycle: ACTIVE
owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Database Reliability
  team: database-reliability
scope:
  environments:
    - production
    - staging
  services:
    - database
risk:
  level: LOW
  blastRadius: none
  reversible: true
parameters:
  - name: targetId
    type: string
    required: true
    description: Identifier of an explicitly registered external database diagnostic target.
steps:
  - id: step-01
    name: Check storage pressure
    order: 1
    type: database
    action: check_storage_pressure
    params:
      targetId: ${targetId}
    failurePolicy: STOP
  - id: step-02
    name: Read storage state
    order: 2
    type: database
    action: get_storage
    params:
      targetId: ${targetId}
    failurePolicy: CONTINUE
verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Database Storage Verification completed and returned diagnostic evidence.
      timeoutSeconds: 30
      optional: false
rollbackConfig:
  strategy: NONE
auditConfig:
  redactSensitiveValues: true
tags:
  - database
  - diagnostic
  - read-only
  - phase-13
