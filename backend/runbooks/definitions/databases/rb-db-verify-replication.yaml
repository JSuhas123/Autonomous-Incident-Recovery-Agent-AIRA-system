apiVersion: aira.io/v1
kind: Runbook
runbookId: RB-DB-VERIFY-REPLICATION
semver: 1.0.0
name: Database Replication Verification
description: Verifies generic database replication state and lag without performing failover.
lifecycle: ACTIVE
owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Database Reliability
  team: database-reliability
scope:
  environments:
    - production
    - staging
  services:
    - database
risk:
  level: LOW
  blastRadius: none
  reversible: true
parameters:
  - name: targetId
    type: string
    required: true
    description: Identifier of an explicitly registered external database diagnostic target.
steps:
  - id: step-01
    name: Check replication lag
    order: 1
    type: database
    action: check_replication_lag
    params:
      targetId: ${targetId}
    failurePolicy: STOP
  - id: step-02
    name: Read replication status
    order: 2
    type: database
    action: get_replication_status
    params:
      targetId: ${targetId}
    failurePolicy: CONTINUE
verification:
  strategy: ALL
  timeoutSeconds: 30
  checks:
    - id: check-01
      type: diagnostic_completed
      description: Database Replication Verification completed and returned diagnostic evidence.
      timeoutSeconds: 30
      optional: false
rollbackConfig:
  strategy: NONE
auditConfig:
  redactSensitiveValues: true
tags:
  - database
  - diagnostic
  - read-only
  - phase-13
