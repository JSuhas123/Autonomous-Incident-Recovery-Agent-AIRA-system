id: api-rate-limit-mitigation
name: "API Rate Limit Mitigation"
description: "Mitigate API rate limiting to restore service availability"
severity: high
services:
  - api
  - backend
estimatedDuration: 180

triggers:
  - type: metric
    condition: "api.rate_limit_exceeded > 100"
  - type: metric
    condition: "api.error_rate > 0.3 AND error_code == 429"
  - type: alert
    name: "High rate limit rejections"

preconditions:
  - check: "API service is running"
    command: "curl -f http://{{api_host}}/health"

steps:
  - step: 1
    name: "Identify rate-limited clients"
    action: "query"
    query: "SELECT client_id, COUNT(*) as requests FROM api_logs WHERE status_code = 429 GROUP BY client_id"

  - step: 2
    name: "Check for malicious traffic"
    action: "query"
    query: "Analyze traffic patterns for potential DDoS"
    
  - step: 3
    name: "Increase rate limit threshold temporarily"
    action: "command"
    command: "curl -X POST http://{{api_host}}/admin/rate-limits -d '{\"threshold\": {{new_threshold}}, \"duration\": 3600}'"
    confirmation: true

  - step: 4
    name: "Enable request caching to reduce load"
    action: "command"
    command: "redis-cli CONFIG SET maxmemory {{cache_size}} && redis-cli CONFIG SET maxmemory-policy allkeys-lru"

  - step: 5
    name: "Block identified malicious clients"
    action: "command"
    command: "iptables -A INPUT -s {{malicious_ip}} -j DROP"
    condition: "traffic_is_malicious == true"

  - step: 6
    name: "Scale API instances"
    action: "command"
    command: "kubectl scale deployment api --replicas={{new_replica_count}}"
    
  - step: 7
    name: "Verify error rate recovery"
    action: "query"
    query: "SELECT error_rate FROM metrics WHERE timestamp > now() - interval '5 minutes'"
    successCriteria: "error_rate < 0.05"
    timeout: 600

postconditions:
  - check: "API is accepting requests"
    command: "curl -f http://{{api_host}}/health"
  - check: "Error rate is below threshold"
    command: "curl http://{{api_host}}/metrics | grep 'http_requests_total{status=\"429\"}'"

notificationChannels:
  - slack

metadata:
  owner: "Platform Team"
  createdAt: "2026-03-26"
  successRate: 0.97
  executionCount: 28
