id: database-failover
name: "Database Failover"
description: "Failover to replica database in case of primary failure"
severity: critical
services:
  - database
  - mysql
estimatedDuration: 600

triggers:
  - type: metric
    condition: "db.connection_error_rate > 0.5"
  - type: metric
    condition: "db.replication_lag > 30"
  - type: alert
    name: "Database primary unreachable"

preconditions:
  - check: "Replica database is healthy"
    query: "SELECT SLAVE_STATUS() as status"
  - check: "Replication lag is acceptable"
    query: "SHOW SLAVE STATUS \G | grep Seconds_Behind_Master"

steps:
  - step: 1
    name: "Verify primary failureType"
    action: "query"
    query: "SELECT 1 FROM mysql.user LIMIT 1"
    onFailure: "proceed"

  - step: 2
    name: "Check replica sync status"
    action: "command"
    command: "mysql -h {{replica_host}} -u {{user}} -p{{password}} -e 'SHOW SLAVE STATUS \G'"

  - step: 3
    name: "Stop replication on replica"
    action: "command"
    command: "mysql -h {{replica_host}} -u {{user}} -p{{password}} -e 'STOP SLAVE'"
    confirmation: true

  - step: 4
    name: "Promote replica to primary"
    action: "command"
    command: "mysql -h {{replica_host}} -u {{user}} -p{{password}} -e 'RESET MASTER'"
    confirmation: true

  - step: 5
    name: "Update DNS records"
    action: "command"
    command: "aws route53 change-resource-record-sets --hosted-zone-id {{zone_id}} --change-batch file://update-dns.json"
    rollback: "aws route53 change-resource-record-sets --hosted-zone-id {{zone_id}} --change-batch file://rollback-dns.json"

  - step: 6
    name: "Update application connection strings"
    action: "command"
    command: "kubectl set env deployment/app DB_HOST={{replica_host}}"

  - step: 7
    name: "Verify application connectivity"
    action: "query"
    query: "SELECT COUNT(*) FROM information_schema.tables"
    condition: "executed_successfully"
    timeout: 300

postconditions:
  - check: "New primary is accepting connections"
    command: "mysql -h {{replica_host}} -u {{user}} -p{{password}} -e 'SELECT 1'"
  - check: "Application is using new primary"
    command: "ps aux | grep 'DB_HOST={{replica_host}}'"

notificationChannels:
  - slack
  - pagerduty
  - email

metadata:
  owner: "Database Team"
  createdAt: "2026-03-26"
  criticality: "CRITICAL"
  successRate: 0.98
  executionCount: 12
  lastExecuted: "2026-03-25"
