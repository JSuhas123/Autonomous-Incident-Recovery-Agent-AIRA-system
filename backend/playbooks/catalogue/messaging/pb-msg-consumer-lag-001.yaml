apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-MSG-CONSUMER-LAG-001
semver: "1.0.0"

name: Messaging Consumer Lag Investigation

description: >
  Investigates increasing consumer lag by correlating consumer state, backlog,
  delivery health and broker health without resetting offsets or restarting
  consumers.

lifecycle: DRAFT

owner:
  ownerType: system
  name: AIRA Messaging Reliability
  team: messaging-reliability

incident:
  types:
    - messaging.consumer_lag
    - mq.consumer.lag
  severities:
    - medium
    - high
    - critical

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.6

risk:
  level: LOW
  blastRadius: none
  reversible: true

policy:
  required: false

approval:
  mode: AUTOMATIC

stages:
  - id: inspect-lag
    order: 1
    name: Inspect Consumer Lag
    type: INVESTIGATION
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-MSG-CHECK-CONSUMER-LAG
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: inspect-consumer
    order: 2
    name: Inspect Consumer Health
    type: INVESTIGATION
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-MSG-CHECK-CONSUMER-HEALTH
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-MSG-CHECK-QUEUE-DEPTH
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-delivery
    order: 3
    name: Verify Delivery Health
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-MSG-CHECK-DELIVERY-HEALTH
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  maxRecoveryAttempts: 1
  escalateTo: messaging-oncall

outcome:
  captureLearning: true
  updateIncidentMemory: false

tags:
  - messaging
  - consumer
  - lag
  - kafka