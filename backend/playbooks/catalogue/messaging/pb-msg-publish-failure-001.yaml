apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-MSG-PUBLISH-FAILURE-001
semver: "1.0.0"

name: Message Publish Failure Investigation

description: >
  Investigates producer-to-broker publish failures by examining publishing,
  connection and broker health without sending synthetic messages or
  modifying producer configuration.

lifecycle: DRAFT

owner:
  ownerType: system
  name: AIRA Messaging Reliability
  team: messaging-reliability

incident:
  types:
    - messaging.publish_failure
  severities:
    - high
    - critical

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.65

risk:
  level: LOW
  blastRadius: none
  reversible: true

policy:
  required: false

approval:
  mode: AUTOMATIC

stages:
  - id: inspect-publish-path
    order: 1
    name: Inspect Publish Path
    type: INVESTIGATION
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-MSG-CHECK-PUBLISH-HEALTH
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: inspect-connectivity
    order: 2
    name: Inspect Broker Connectivity
    type: INVESTIGATION
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-MSG-CHECK-CONNECTION-HEALTH
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-MSG-CHECK-BROKER-HEALTH
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-publish-path
    order: 3
    name: Verify Publish Path Evidence
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-MSG-CHECK-PUBLISH-HEALTH
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  maxRecoveryAttempts: 1
  escalateTo: messaging-oncall

outcome:
  captureLearning: true
  updateIncidentMemory: false

tags:
  - messaging
  - producer
  - publish
  - broker