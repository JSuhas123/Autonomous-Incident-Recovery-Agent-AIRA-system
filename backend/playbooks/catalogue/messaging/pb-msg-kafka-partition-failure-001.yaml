apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-MSG-KAFKA-PARTITION-FAILURE-001
semver: "1.0.0"

name: Kafka Partition Failure Investigation

description: >
  Investigates unavailable, leaderless or otherwise unhealthy Kafka
  partitions without triggering leader elections or partition reassignment.

lifecycle: DRAFT

owner:
  ownerType: system
  name: AIRA Messaging Reliability
  team: messaging-reliability

incident:
  types:
    - kafka.partition_failure
    - messaging.partition_unavailable
  severities:
    - high
    - critical

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.7

risk:
  level: LOW
  blastRadius: none
  reversible: true

policy:
  required: false

approval:
  mode: AUTOMATIC

stages:
  - id: inspect-partitions
    order: 1
    name: Inspect Partition Health
    type: INVESTIGATION
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-MSG-CHECK-PARTITION-HEALTH
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: inspect-broker
    order: 2
    name: Inspect Kafka Broker Health
    type: INVESTIGATION
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-MSG-CHECK-BROKER-HEALTH
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-replication
    order: 3
    name: Verify Replication Health
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-MSG-CHECK-REPLICATION-HEALTH
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  maxRecoveryAttempts: 1
  escalateTo: messaging-oncall

outcome:
  captureLearning: true
  updateIncidentMemory: false

tags:
  - messaging
  - kafka
  - partition
  - broker