apiVersion: aira.io/v1
kind: Playbook

playbookId: PB-DB-DISK-PRESSURE-001
semver: 2.0.0

name: Database Storage Pressure Investigation

description: >
  Investigates database storage pressure and verifies current storage
  headroom using read-only diagnostics. This playbook does not delete
  database data, purge logs, vacuum tables, resize volumes, or perform
  other storage mutations.

lifecycle: DRAFT

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Database Reliability
  team: database-reliability

scope:
  environments:
    - production
    - staging
  services:
    - database

incident:
  types:
    - DatabaseDiskPressure
    - DatabaseStoragePressure
    - database.disk_pressure
    - database.storage.pressure
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - database
    - postgresql
    - mysql
    - mongodb
  environments:
    - production
    - staging

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.70

risk:
  level: LOW
  blastRadius: database-target
  reversible: true

policy:
  required: true

approval:
  mode: MANUAL

stages:
  - id: investigate-storage
    order: 1
    name: Investigate Database Storage
    type: INVESTIGATION
    description: >
      Inspect storage utilization, available capacity, and storage-pressure
      indicators for the affected database target.
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-DB-INVESTIGATE-STORAGE
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-storage
    order: 2
    name: Verify Storage State
    type: VERIFICATION
    description: >
      Verify whether storage utilization remains under unsafe pressure.
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-DB-VERIFY-STORAGE
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: dba-oncall

outcome:
  captureLearning: true
  updateIncidentMemory: true

tags:
  - database
  - storage
  - disk-pressure
  - diagnostic
  - read-only