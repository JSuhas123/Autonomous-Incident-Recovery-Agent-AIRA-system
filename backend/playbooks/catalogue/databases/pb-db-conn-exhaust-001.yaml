apiVersion: aira.io/v1
kind: Playbook

playbookId: PB-DB-CONN-EXHAUST-001
semver: 2.0.0

name: Database Connection Pool Exhaustion Investigation

description: >
  Investigates database connection-pool exhaustion using deterministic
  read-only diagnostics. Collects active connection state, evaluates
  connection-pool pressure, and verifies whether connection utilization
  has returned to a healthy condition. This playbook does not terminate
  sessions or mutate database configuration.

lifecycle: DRAFT

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Database Reliability
  team: database-reliability

scope:
  environments:
    - production
    - staging
  services:
    - database

incident:
  types:
    - DatabaseConnectionExhaustion
    - db.connection.pool.exhausted
    - TooManyConnections
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - database
    - postgresql
    - mysql
    - mongodb
  environments:
    - production
    - staging

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.70

risk:
  level: LOW
  blastRadius: database-target
  reversible: true

policy:
  required: true

approval:
  mode: MANUAL

stages:
  - id: investigate-connections
    order: 1
    name: Investigate Database Connections
    type: INVESTIGATION
    description: >
      Collect active connection usage and evaluate connection-pool pressure.
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-DB-INVESTIGATE-CONNECTIONS
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-connection-pool
    order: 2
    name: Verify Connection Pool State
    type: VERIFICATION
    description: >
      Re-evaluate the pool and active connection state to determine whether
      the exhaustion condition is still present.
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-DB-VERIFY-CONNECTION-POOL
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: dba-oncall

outcome:
  captureLearning: true
  updateIncidentMemory: true

tags:
  - database
  - connections
  - connection-pool
  - diagnostic
  - read-only