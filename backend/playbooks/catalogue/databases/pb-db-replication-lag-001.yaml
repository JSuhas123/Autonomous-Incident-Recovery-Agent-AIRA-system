apiVersion: aira.io/v1
kind: Playbook

playbookId: PB-DB-REPLICATION-LAG-001
semver: 2.0.0

name: Database Replication Lag Investigation

description: >
  Investigates excessive database replication lag and verifies current
  replication state using read-only diagnostics. This playbook does not
  stop replication, promote replicas, perform failover, or modify database
  topology.

lifecycle: DRAFT

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Database Reliability
  team: database-reliability

scope:
  environments:
    - production
    - staging
  services:
    - database

incident:
  types:
    - DatabaseReplicationLag
    - DatabaseReplicationDegraded
    - database.replication_lag
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - database
    - postgresql
    - mysql
    - mongodb
    - redis
  environments:
    - production
    - staging

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.75

risk:
  level: LOW
  blastRadius: database-target
  reversible: true

policy:
  required: true

approval:
  mode: MANUAL

stages:
  - id: investigate-replication
    order: 1
    name: Investigate Replication State
    type: INVESTIGATION
    description: >
      Collect replication state and evaluate observed replication lag.
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-DB-INVESTIGATE-REPLICATION
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-replication
    order: 2
    name: Verify Replication State
    type: VERIFICATION
    description: >
      Verify whether replication lag is currently within acceptable limits.
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-DB-VERIFY-REPLICATION
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: dba-oncall

outcome:
  captureLearning: true
  updateIncidentMemory: true

tags:
  - database
  - replication
  - replication-lag
  - diagnostic
  - read-only