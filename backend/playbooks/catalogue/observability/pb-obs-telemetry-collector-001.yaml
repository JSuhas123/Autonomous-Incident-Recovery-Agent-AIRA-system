apiVersion: aira.io/v1
kind: Playbook

playbookId: PB-OBS-TELEMETRY-COLLECTOR-001
semver: "2.0.0"

name: Telemetry Collector Failure Investigation

description: >
  Investigates failures affecting OpenTelemetry Collectors, Prometheus agents,
  Fluent Bit, Fluentd and equivalent telemetry collectors. Inspects collector
  health, exporter state, ingestion and telemetry flow without restarting or
  reconfiguring collector workloads.

lifecycle: DRAFT

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - telemetry-collector

incident:
  types:
    - observability.collector_failure
    - TelemetryCollectorFailure
    - OpenTelemetryCollectorFailure
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - observability
    - opentelemetry
    - prometheus
    - fluent-bit
    - fluentd
  environments:
    - production
    - staging

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.80

risk:
  level: LOW
  blastRadius: observability-target
  reversible: true

policy:
  required: true
  approvalGroups:
    - observability-team

approval:
  mode: MANUAL

stages:
  - id: investigate-collector
    order: 1
    name: Investigate Collector Health
    type: INVESTIGATION
    description: >
      Inspect the health and diagnostic state of the affected telemetry
      collector.
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-OBS-CHECK-COLLECTOR-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: investigate-export
    order: 2
    name: Investigate Export and Ingestion
    type: INVESTIGATION
    description: >
      Inspect exporter and downstream ingestion health.
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-OBS-CHECK-EXPORTER-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-OBS-CHECK-INGESTION-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: investigate-telemetry-flow
    order: 3
    name: Investigate Telemetry Flow
    type: INVESTIGATION
    description: >
      Determine which telemetry signals are no longer flowing through the
      collector.
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-OBS-CHECK-METRICS-FLOW
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-OBS-CHECK-LOGS-FLOW
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-OBS-CHECK-TRACES-FLOW
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-collector
    order: 4
    name: Verify Collector Recovery
    type: VERIFICATION
    description: >
      Re-check collector and ingestion health after approved remediation.
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-OBS-CHECK-COLLECTOR-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-OBS-CHECK-INGESTION-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: observability-oncall

outcome:
  captureLearning: true
  updateIncidentMemory: true

tags:
  - observability
  - telemetry
  - collector
  - opentelemetry
  - diagnostic
  - read-only