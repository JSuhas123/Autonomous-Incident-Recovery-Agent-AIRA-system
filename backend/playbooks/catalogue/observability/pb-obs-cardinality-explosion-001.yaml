apiVersion: aira.io/v1
kind: Playbook

playbookId: PB-OBS-CARDINALITY-EXPLOSION-001
semver: "1.0.0"

name: Metrics Cardinality Explosion Investigation

description: >
  Investigates excessive metrics cardinality, unexpected series growth and
  label-dimension explosion without deleting or rewriting stored series.

lifecycle: DRAFT

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - metrics

incident:
  types:
    - observability.cardinality_explosion
    - MetricsCardinalityHigh
    - PrometheusCardinalityExplosion
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - observability
    - prometheus
  environments:
    - production
    - staging

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.80

risk:
  level: LOW
  blastRadius: observability-target
  reversible: true

policy:
  required: true

approval:
  mode: MANUAL

stages:
  - id: investigate-cardinality
    order: 1
    name: Investigate Metrics Cardinality
    type: INVESTIGATION
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-OBS-CHECK-CARDINALITY
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: investigate-metrics-health
    order: 2
    name: Investigate Metrics Pipeline
    type: INVESTIGATION
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-OBS-CHECK-METRICS-FLOW
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-OBS-CHECK-INGESTION-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-cardinality
    order: 3
    name: Verify Cardinality State
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-OBS-CHECK-CARDINALITY
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: observability-oncall

outcome:
  captureLearning: true
  updateIncidentMemory: true

tags:
  - observability
  - metrics
  - prometheus
  - cardinality
  - diagnostic
  - read-only