apiVersion: aira.io/v1
kind: Playbook

playbookId: PB-OBS-TRACE-PIPELINE-FAILURE-001
semver: "1.0.0"

name: Trace Pipeline Failure Investigation

description: >
  Investigates missing or degraded distributed tracing across collectors,
  exporters and trace ingestion backends.

lifecycle: DRAFT

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - tracing

incident:
  types:
    - observability.trace_pipeline_failure
    - TracesMissing
    - TraceIngestionFailure
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - observability
    - opentelemetry
    - tracing
  environments:
    - production
    - staging

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.75

risk:
  level: LOW
  blastRadius: observability-target
  reversible: true

policy:
  required: true

approval:
  mode: MANUAL

stages:
  - id: investigate-traces
    order: 1
    name: Investigate Trace Flow
    type: INVESTIGATION
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-OBS-CHECK-TRACES-FLOW
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-OBS-CHECK-COLLECTOR-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: investigate-trace-ingestion
    order: 2
    name: Investigate Trace Ingestion
    type: INVESTIGATION
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-OBS-CHECK-EXPORTER-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-OBS-CHECK-INGESTION-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-traces
    order: 3
    name: Verify Trace Flow
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-OBS-CHECK-TRACES-FLOW
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: observability-oncall

outcome:
  captureLearning: true
  updateIncidentMemory: true

tags:
  - observability
  - tracing
  - telemetry
  - diagnostic
  - read-only