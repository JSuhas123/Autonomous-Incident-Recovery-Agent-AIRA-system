apiVersion: aira.io/v1
kind: Playbook

playbookId: PB-OBS-INGESTION-FAILURE-001
semver: "1.0.0"

name: Telemetry Ingestion Failure Investigation

description: >
  Investigates rejected, delayed or unavailable telemetry ingestion across
  observability backends.

lifecycle: DRAFT

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - ingestion

incident:
  types:
    - observability.ingestion_failure
    - TelemetryIngestionFailure
    - ObservabilityBackendUnavailable
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - observability
    - opentelemetry
    - prometheus
  environments:
    - production
    - staging

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.80

risk:
  level: LOW
  blastRadius: observability-target
  reversible: true

policy:
  required: true

approval:
  mode: MANUAL

stages:
  - id: investigate-ingestion
    order: 1
    name: Investigate Telemetry Ingestion
    type: INVESTIGATION
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-OBS-CHECK-INGESTION-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-OBS-CHECK-TARGET-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: investigate-export
    order: 2
    name: Investigate Export Path
    type: INVESTIGATION
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-OBS-CHECK-EXPORTER-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-ingestion
    order: 3
    name: Verify Telemetry Ingestion
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-OBS-CHECK-INGESTION-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: observability-oncall

outcome:
  captureLearning: true
  updateIncidentMemory: true

tags:
  - observability
  - ingestion
  - backend
  - diagnostic
  - read-only