apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-OBS-ALERT-PIPELINE-001
semver: "1.0.0"
name: Alert Pipeline Failure Recovery
description: >
  Detects and resolves failures in the alerting pipeline (Alertmanager,
  PagerDuty forwarder, notification webhook). Restarts pipeline components,
  validates routing rules and sends a test notification to confirm end-to-end
  delivery.
lifecycle: DRAFT

owner:
  type: system

incidentMatching:
  incidentType: observability.alert_pipeline_failure
  severity: [high, critical]
  environment: [production]

triggers:
  - type: condition
    conditions:
      - field: resource.kind
        operator: equals
        value: AlertPipeline

requiredEvidence:
  - namespace
  - pipeline_component
  - failure_reason

stages:
  - stageId: investigate-pipeline
    name: Investigate Alert Pipeline
    type: INVESTIGATION
    order: 1
    description: Inspect Alertmanager status and recent delivery errors
    runbooks:
      - runbookId: RB-K8S-POD-RESTART
        semver: ">=1.0.0"
        parameterMappings:
          namespace: "${incident.resource.namespace}"
          label_selector: "app=alertmanager"
        required: true
    failurePolicy: STOP

  - stageId: restart-pipeline-component
    name: Restart Pipeline Component
    type: RECOVERY
    order: 2
    description: Restart the failing component in the alert pipeline
    runbooks:
      - runbookId: RB-K8S-POD-RESTART
        semver: ">=1.0.0"
        parameterMappings:
          namespace: "${incident.resource.namespace}"
          deployment_name: "${incident.evidence.pipeline_component}"
        required: true
    failurePolicy: ESCALATE

  - stageId: verify-alert-delivery
    name: Verify Alert Delivery
    type: VERIFICATION
    order: 3
    description: Send test alert and confirm end-to-end delivery
    runbooks:
      - runbookId: RB-K8S-POD-RESTART
        semver: ">=1.0.0"
        parameterMappings:
          namespace: "${incident.resource.namespace}"
          pipeline_component: "${incident.evidence.pipeline_component}"
        required: true
    failurePolicy: ESCALATE

risk:
  level: HIGH
  blastRadius: service
  reversible: true
  rollbackStrategy: NONE

policy:
  required: false

approval:
  mode: AUTOMATIC

rollback:
  strategy: NONE

escalation:
  enabled: true
  maxAttempts: 2
  escalateTo: observability-oncall
