apiVersion: aira.io/v1
kind: Playbook

playbookId: PB-OBS-ALERT-PIPELINE-001
semver: "2.0.0"

name: Alert Pipeline Failure Investigation

description: >
  Investigates failures in the alert evaluation, routing and delivery pipeline.
  Inspects alert-pipeline health and downstream alert delivery without
  restarting Alertmanager, modifying routing rules, changing receivers,
  creating silences or sending synthetic alerts.

lifecycle: DRAFT

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Observability Reliability
  team: observability-reliability

scope:
  environments:
    - production
    - staging
  services:
    - observability
    - alerting

incident:
  types:
    - observability.alert_pipeline_failure
    - AlertPipelineFailure
    - AlertDeliveryFailure
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - observability
    - alertmanager
    - prometheus
    - pagerduty
    - webhook
  environments:
    - production
    - staging

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.80

risk:
  level: LOW
  blastRadius: observability-target
  reversible: true

policy:
  required: true
  approvalGroups:
    - observability-team

approval:
  mode: MANUAL

stages:
  - id: investigate-alert-pipeline
    order: 1
    name: Investigate Alert Pipeline
    type: INVESTIGATION
    description: >
      Inspect alert processing, routing and pipeline-health evidence.
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-OBS-CHECK-ALERT-PIPELINE
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: investigate-alert-delivery
    order: 2
    name: Investigate Alert Delivery
    type: INVESTIGATION
    description: >
      Determine whether evaluated alerts are reaching configured downstream
      notification destinations.
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-OBS-CHECK-ALERT-DELIVERY
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-OBS-CHECK-TARGET-HEALTH
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-alert-pipeline
    order: 3
    name: Verify Alert Pipeline State
    type: VERIFICATION
    description: >
      Re-check alert processing and delivery after remediation has occurred
      externally or through an approved operational workflow.
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-OBS-CHECK-ALERT-PIPELINE
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-OBS-CHECK-ALERT-DELIVERY
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: observability-oncall

outcome:
  captureLearning: true
  updateIncidentMemory: true

tags:
  - observability
  - alerting
  - alertmanager
  - pagerduty
  - diagnostic
  - read-only