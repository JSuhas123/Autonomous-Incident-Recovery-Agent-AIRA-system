apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-CONTAINER-CRASH-001
semver: "2.0.0"

name: Container Crash Investigation

description: >
  Investigates containers that terminate unexpectedly or exit with non-zero
  status codes. Correlates container state, termination reason, previous logs
  and restart history without restarting or modifying the workload.

lifecycle: DRAFT

owner:
  ownerType: system
  name: AIRA Container Reliability
  team: platform-reliability

incident:
  types:
    - container.crash
    - ContainerCrash
  severities:
    - medium
    - high
    - critical

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.6

risk:
  level: LOW
  blastRadius: none
  reversible: true

policy:
  required: false

approval:
  mode: AUTOMATIC

stages:
  - id: inspect-container-state
    order: 1
    name: Inspect Container State
    type: INVESTIGATION
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-CONTAINER-CHECK-STATE
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-CONTAINER-CHECK-EXIT-REASON
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: inspect-crash-evidence
    order: 2
    name: Inspect Crash Evidence
    type: INVESTIGATION
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-CONTAINER-CHECK-LOGS
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-CONTAINER-CHECK-RESTART-HISTORY
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-runtime
    order: 3
    name: Verify Runtime Health
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-CONTAINER-CHECK-RUNTIME-HEALTH
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  maxRecoveryAttempts: 1
  escalateTo: oncall-platform

outcome:
  captureLearning: true
  updateIncidentMemory: false

tags:
  - containers
  - crash
  - runtime
  - diagnostic
  - read-only