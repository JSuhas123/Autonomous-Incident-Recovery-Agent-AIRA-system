apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-CONTAINER-RESOURCE-EXHAUST-001
semver: "2.0.0"

name: Container Resource Exhaustion Investigation

description: >
  Investigates containers experiencing excessive CPU, memory or other
  resource consumption. Correlates current usage, configured resource
  limits and process health without scaling workloads or changing limits.

lifecycle: DRAFT

owner:
  ownerType: system
  name: AIRA Container Reliability
  team: platform-reliability

incident:
  types:
    - container.resource_exhaustion
    - ContainerResourceExhaustion
  severities:
    - high
    - critical

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.65

risk:
  level: LOW
  blastRadius: none
  reversible: true

policy:
  required: false

approval:
  mode: AUTOMATIC

stages:
  - id: inspect-resource-usage
    order: 1
    name: Inspect Resource Usage
    type: INVESTIGATION
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-CONTAINER-CHECK-RESOURCE-USAGE
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: inspect-resource-policy
    order: 2
    name: Inspect Resource Limits
    type: INVESTIGATION
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-CONTAINER-CHECK-RESOURCE-LIMITS
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-CONTAINER-CHECK-PROCESS-HEALTH
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-container-state
    order: 3
    name: Verify Container State
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-CONTAINER-CHECK-STATE
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  maxRecoveryAttempts: 1
  escalateTo: oncall-platform

outcome:
  captureLearning: true
  updateIncidentMemory: false

tags:
  - containers
  - cpu
  - memory
  - resources
  - diagnostic