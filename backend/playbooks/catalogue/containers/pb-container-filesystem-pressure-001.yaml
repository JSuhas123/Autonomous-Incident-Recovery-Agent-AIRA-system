apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-CONTAINER-FILESYSTEM-PRESSURE-001
semver: "1.0.0"

name: Container Filesystem Pressure Investigation

description: >
  Investigates container filesystem or ephemeral storage pressure and
  correlates storage consumption with container and runtime health.

lifecycle: DRAFT

owner:
  ownerType: system
  name: AIRA Container Reliability
  team: platform-reliability

incident:
  types:
    - container.filesystem_pressure
    - container.ephemeral_storage_pressure
  severities:
    - medium
    - high
    - critical

requiredEvidence:
  - resource.targetId

conditions:
  minimumConfidence: 0.6

risk:
  level: LOW
  blastRadius: none
  reversible: true

policy:
  required: false

approval:
  mode: AUTOMATIC

stages:
  - id: inspect-filesystem
    order: 1
    name: Inspect Filesystem Usage
    type: INVESTIGATION
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-CONTAINER-CHECK-FILESYSTEM-USAGE
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: inspect-container
    order: 2
    name: Inspect Container State
    type: INVESTIGATION
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-CONTAINER-CHECK-STATE
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-runtime
    order: 3
    name: Verify Runtime Health
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-CONTAINER-CHECK-RUNTIME-HEALTH
        semver: ">=1.0.0"
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  maxRecoveryAttempts: 1
  escalateTo: oncall-platform

outcome:
  captureLearning: true
  updateIncidentMemory: false

tags:
  - containers
  - filesystem
  - storage
  - pressure