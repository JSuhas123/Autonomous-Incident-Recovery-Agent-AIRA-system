apiVersion: aira.io/v1
kind: Playbook

playbookId: PB-NET-DNS-FAILURE-001
semver: "2.0.0"

name: DNS Resolution Failure Investigation

description: >
  Investigates DNS resolution failures using deterministic read-only
  networking diagnostics. Validates DNS resolution and supporting network
  connectivity without restarting CoreDNS, modifying resolver configuration,
  or changing DNS records.

lifecycle: DRAFT

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Networking Reliability
  team: networking-reliability

scope:
  environments:
    - production
    - staging
  services:
    - networking
    - dns

incident:
  types:
    - network.dns_failure
    - DNSResolutionFailure
    - DNSUnavailable
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - networking
    - dns
    - kubernetes
  environments:
    - production
    - staging

requiredEvidence:
  - resource.targetId
  - failing_hostname

conditions:
  minimumConfidence: 0.75

risk:
  level: LOW
  blastRadius: network-target
  reversible: true

policy:
  required: true
  approvalGroups:
    - network-team

approval:
  mode: MANUAL

stages:
  - id: investigate-dns
    order: 1
    name: Investigate DNS Resolution
    type: INVESTIGATION
    description: >
      Inspect DNS resolution and supporting connectivity for the affected
      network target.
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-NET-INVESTIGATE-DNS
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

      - runbookId: RB-NET-INVESTIGATE-CONNECTIVITY
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-dns
    order: 2
    name: Verify DNS Resolution
    type: VERIFICATION
    description: >
      Re-check DNS resolution to determine whether the incident condition
      remains present.
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-NET-VERIFY-DNS
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: network-oncall

outcome:
  captureLearning: true
  updateIncidentMemory: true

tags:
  - networking
  - dns
  - resolution
  - diagnostic
  - read-only