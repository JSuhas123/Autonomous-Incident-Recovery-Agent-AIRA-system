apiVersion: aira.io/v1
kind: Playbook

playbookId: PB-NET-TLS-EXPIRY-001
semver: "2.0.0"

name: TLS Certificate Expiry Investigation

description: >
  Investigates expired or imminently expiring TLS certificates using
  deterministic TLS diagnostics. Validates TLS handshake and certificate-chain
  state without triggering certificate renewal, replacing certificates,
  modifying cert-manager resources, or reloading services.

lifecycle: DRAFT

owner:
  ownerType: system
  ownerId: aira-core
  name: AIRA Networking Reliability
  team: networking-reliability

scope:
  environments:
    - production
    - staging
  services:
    - networking
    - tls

incident:
  types:
    - network.tls_expiry
    - TLSCertificateExpiry
    - CertificateExpired
    - CertificateExpiring
  severities:
    - P1
    - P2
    - critical
    - high
    - medium
  providers:
    - networking
    - tls
    - kubernetes
    - cert-manager
  environments:
    - production
    - staging

requiredEvidence:
  - resource.targetId
  - domain_name
  - expiry_timestamp

conditions:
  minimumConfidence: 0.80

risk:
  level: LOW
  blastRadius: network-target
  reversible: true

policy:
  required: true
  approvalGroups:
    - network-team
    - security-team

approval:
  mode: MANUAL

stages:
  - id: investigate-certificate
    order: 1
    name: Investigate TLS Certificate
    type: INVESTIGATION
    description: >
      Inspect TLS handshake and certificate-chain state for the affected
      endpoint.
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-NET-INVESTIGATE-TLS
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: investigate-endpoint-connectivity
    order: 2
    name: Investigate Endpoint Connectivity
    type: INVESTIGATION
    description: >
      Confirm that certificate symptoms are not caused by broader endpoint
      connectivity failure.
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-NET-INVESTIGATE-CONNECTIVITY
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

  - id: verify-certificate
    order: 3
    name: Verify TLS Certificate
    type: VERIFICATION
    description: >
      Re-check TLS state after external renewal or remediation and confirm
      whether the certificate and handshake are healthy.
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-NET-VERIFY-TLS
        required: true
        parameterMappings:
          targetId: "${incident.resource.targetId}"

rollback:
  strategy: NONE

escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: security-oncall

outcome:
  captureLearning: true
  updateIncidentMemory: true

tags:
  - networking
  - tls
  - certificate
  - expiry
  - diagnostic
  - read-only