apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-NET-TLS-EXPIRY-001
semver: "1.0.0"
name: TLS Certificate Expiry Response
description: >
  Detects imminently expiring or already-expired TLS certificates. Triggers
  certificate renewal via cert-manager or flags for manual rotation. Validates
  the new certificate and reloads affected services.
lifecycle: DRAFT

owner:
  type: system

incidentMatching:
  incidentType: network.tls_expiry
  severity: [medium, high, critical]
  environment: [production, staging]

triggers:
  - type: condition
    conditions:
      - field: resource.kind
        operator: equals
        value: Certificate

requiredEvidence:
  - namespace
  - certificate_name
  - expiry_timestamp
  - domain_name

stages:
  - stageId: investigate-certificate
    name: Investigate Certificate Status
    type: INVESTIGATION
    order: 1
    description: Retrieve certificate details and expiry timeline
    runbooks:
      - runbookId: RB-K8S-POD-RESTART
        semver: ">=1.0.0"
        parameterMappings:
          namespace: "${incident.resource.namespace}"
          certificate_name: "${incident.evidence.certificate_name}"
        required: true
    failurePolicy: STOP

  - stageId: trigger-renewal
    name: Trigger Certificate Renewal
    type: RECOVERY
    order: 2
    description: Annotate cert-manager Certificate resource to trigger renewal
    runbooks:
      - runbookId: RB-K8S-POD-RESTART
        semver: ">=1.0.0"
        parameterMappings:
          namespace: "${incident.resource.namespace}"
          certificate_name: "${incident.evidence.certificate_name}"
        required: true
    failurePolicy: ESCALATE

  - stageId: verify-certificate-valid
    name: Verify Certificate Valid
    type: VERIFICATION
    order: 3
    description: Confirm new certificate is issued and loaded
    runbooks:
      - runbookId: RB-K8S-POD-RESTART
        semver: ">=1.0.0"
        parameterMappings:
          namespace: "${incident.resource.namespace}"
          domain_name: "${incident.evidence.domain_name}"
        required: true
    failurePolicy: ESCALATE

risk:
  level: HIGH
  blastRadius: service
  reversible: false
  rollbackStrategy: NONE

policy:
  required: true
  approvalGroups: [security-team]

approval:
  mode: MANUAL

rollback:
  strategy: NONE

escalation:
  enabled: true
  maxAttempts: 1
  escalateTo: security-oncall
