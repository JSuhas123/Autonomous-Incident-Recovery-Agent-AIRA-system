apiVersion: aira.io/v1
kind: Playbook

playbookId: PB-K8S-CRASHLOOP-001
semver: 1.2.0

name: Kubernetes CrashLoopBackOff Recovery

description: >
  Deterministic recovery playbook for Kubernetes workloads affected by
  CrashLoopBackOff. Investigation is performed before any recovery action.
  Recovery uses only approved canonical runbooks and is followed by
  mandatory health verification. AI does not directly execute infrastructure.

lifecycle: ACTIVE

owner:
  ownerType: system
  name: AIRA Platform
  team: site-reliability

incident:
  types:
    - CrashLoopBackOff
    - PodCrashLoop
    - kubernetes.pod.crashloop
    - K8S_CRASH_LOOP_BACKOFF

  severities:
    - P1
    - P2
    - critical
    - high

  providers:
    - kubernetes
    - k8s

  environments:
    - production
    - staging

requiredEvidence:
  - resource.pod
  - resource.namespace

conditions:
  minimumConfidence: 0.7

  requiredSignals:
    - pod_name
    - namespace

triggers:
  all:
    - field: incident.type
      operator: contains
      value: crashloop

  any:
    - field: incident.severity
      operator: equals
      value: P1

    - field: incident.severity
      operator: equals
      value: P2

    - field: incident.severity
      operator: equals
      value: critical

risk:
  level: HIGH
  blastRadius: pod

policy:
  required: true

approval:
  mode: CONDITIONAL

  conditions:
    requiresApproval: false

stages:
  - id: investigate-pod
    order: 1
    name: Investigate Pod State
    type: INVESTIGATION

    description: >
      Collect read-only Kubernetes evidence before recovery.
      The investigation must establish container state,
      restart count, recent termination reason, events,
      and controller ownership.

    failurePolicy: ESCALATE

    runbooks:
      - runbookId: RB-K8S-INVESTIGATE-POD
        versionConstraint: ">=1.0.0"
        required: true

        description: >
          Collect pod status, conditions, recent events,
          owner references, container state, and bounded logs.

        parameterMappings:
          pod: "${incident.resource.pod}"
          namespace: "${incident.resource.namespace}"
          tail_lines: "100"

  - id: recover-pod
    order: 2
    name: Restart Crashed Pod
    type: RECOVERY

    description: >
      Recreate the unhealthy pod through its Kubernetes controller.
      This step must not modify the controller specification.

    failurePolicy: ESCALATE

    runbooks:
      - runbookId: RB-K8S-RESTART-POD
        versionConstraint: ">=1.0.0"
        required: true

        description: >
          Restart only the identified unhealthy pod using
          the canonical restart runbook.

        parameterMappings:
          pod: "${incident.resource.pod}"
          namespace: "${incident.resource.namespace}"

  - id: verify-recovery
    order: 3
    name: Verify Pod Recovery
    type: VERIFICATION

    description: >
      Verify that the recreated workload reaches Running and Ready
      state and does not immediately return to CrashLoopBackOff.

    failurePolicy: ESCALATE

    runbooks:
      - runbookId: RB-K8S-VERIFY-POD
        versionConstraint: ">=1.0.0"
        required: true

        parameterMappings:
          pod: "${incident.resource.pod}"
          namespace: "${incident.resource.namespace}"

rollback:
  strategy: NONE

escalation:
  maxRecoveryAttempts: 1
  condition: "verification_failed OR restart_failed OR crashloop_persists"
  escalateTo: oncall-sre

  notifyChannels:
    - slack-alerts
    - pagerduty

outcome:
  captureLearning: true
  updateIncidentMemory: true

  successMetrics:
    - pod_running
    - pod_ready
    - crashloop_cleared
    - restart_count_stable

tags:
  - kubernetes
  - pod
  - crashloop
  - sre
  - recovery