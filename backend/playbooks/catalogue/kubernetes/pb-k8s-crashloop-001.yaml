apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-K8S-CRASHLOOP-001
semver: 1.1.0
name: Kubernetes CrashLoopBackOff Recovery
description: >
  Deterministic recovery playbook for Kubernetes pods stuck in CrashLoopBackOff.
  Uses separate canonical runbooks per stage: investigation, restart, verification.
  AI DOES NOT EXECUTE INFRASTRUCTURE — agents recommend, V1 engine executes.

lifecycle: ACTIVE

owner:
  ownerType: system
  name: AIRA Platform
  team: site-reliability

incident:
  types:
    - CrashLoopBackOff
    - PodCrashLoop
    - kubernetes.pod.crashloop
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - kubernetes
    - k8s
  environments:
    - production
    - staging

requiredEvidence:
  - resource.pod
  - resource.namespace

conditions:
  minimumConfidence: 0.7
  requiredSignals:
    - pod_name
    - namespace

triggers:
  all:
    - field: incident.type
      operator: contains
      value: crashloop
  any:
    - field: incident.severity
      operator: equals
      value: P1
    - field: incident.severity
      operator: equals
      value: P2
    - field: incident.severity
      operator: equals
      value: critical

risk:
  level: HIGH
  blastRadius: pod

policy:
  required: true

approval:
  mode: CONDITIONAL
  conditions:
    requiresApproval: false  # auto-approve for known crashloop pattern

stages:
  - id: investigate-pod
    order: 1
    name: Investigate Pod State
    type: INVESTIGATION
    description: Read-only collection of pod status, events, and logs before any action
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-K8S-INVESTIGATE-POD
        versionConstraint: ">=1.0.0"
        required: true
        description: Collect pod status, events, and logs
        parameterMappings:
          pod: "${incident.resource.pod}"
          namespace: "${incident.resource.namespace}"
          tail_lines: "100"

  - id: recover-pod
    order: 2
    name: Restart Crashed Pod
    type: RECOVERY
    description: Delete the crashed pod to trigger controller-based recreation
    failurePolicy: ROLLBACK
    runbooks:
      - runbookId: RB-K8S-RESTART-POD
        versionConstraint: ">=1.0.0"
        required: true
        description: Restart the crashed pod using the canonical restart runbook
        parameterMappings:
          pod: "${incident.resource.pod}"
          namespace: "${incident.resource.namespace}"

  - id: verify-recovery
    order: 3
    name: Verify Pod Recovery
    type: VERIFICATION
    description: Confirm the pod is running and healthy after restart
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-K8S-VERIFY-POD
        versionConstraint: ">=1.0.0"
        required: true
        description: Verify the pod is Running and Ready
        parameterMappings:
          pod: "${incident.resource.pod}"
          namespace: "${incident.resource.namespace}"

rollback:
  strategy: NONE

escalation:
  maxRecoveryAttempts: 3
  condition: "verification_failed OR restart_failed"
  escalateTo: oncall-sre
  notifyChannels:
    - slack-alerts
    - pagerduty

outcome:
  captureLearning: true
  updateIncidentMemory: true
  successMetrics:
    - pod_running
    - restart_count_stable

tags:
  - kubernetes
  - pod
  - crashloop
  - sre
  - recovery
