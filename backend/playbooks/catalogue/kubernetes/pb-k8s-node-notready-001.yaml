apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-K8S-NODE-NOTREADY-001
semver: 1.0.0
name: Kubernetes Node NotReady Recovery
description: >
  Recovery playbook for Kubernetes nodes stuck in NotReady state.
  Investigates node conditions, drains workloads, and triggers node remediation.
lifecycle: ACTIVE

owner:
  ownerType: system
  name: AIRA Platform
  team: site-reliability

incident:
  types:
    - NodeNotReady
    - kubernetes.node.notready
    - NodeConditionFailed
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - kubernetes

requiredEvidence:
  - resource.node
  - resource.namespace

conditions:
  minimumConfidence: 0.75

risk:
  level: CRITICAL
  blastRadius: cluster

policy:
  required: true

approval:
  mode: MANUAL

stages:
  - id: investigate-node
    order: 1
    name: Investigate Node Conditions
    type: INVESTIGATION
    failurePolicy: STOP
    runbooks:
      - runbookId: RB-K8S-INVESTIGATE-NODE
        required: true
        parameterMappings:
          node: "${incident.resource.node}"
          namespace: "${incident.resource.namespace}"

  - id: cordon-node
    order: 2
    name: Cordon NotReady Node
    type: MITIGATION
    description: Prevent new scheduling on the NotReady node to protect workloads
    failurePolicy: ESCALATE
    requiresApproval: true
    runbooks:
      - runbookId: RB-K8S-CORDON-NODE
        required: true
        parameterMappings:
          node: "${incident.resource.node}"

  - id: verify-node-cordoned
    order: 3
    name: Verify Node Cordoned
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-K8S-INVESTIGATE-NODE
        required: true
        parameterMappings:
          node: "${incident.resource.node}"

rollback:
  strategy: NONE

escalation:
  maxRecoveryAttempts: 1
  escalateTo: oncall-sre
  notifyChannels:
    - slack-alerts
    - pagerduty

outcome:
  captureLearning: true
  updateIncidentMemory: true

tags:
  - kubernetes
  - node
  - notready
  - drain
  - cluster
