apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-K8S-POD-PENDING-001
semver: "1.1.0"
name: Kubernetes Pod Stuck in Pending
description: >
  Diagnoses and resolves pods stuck in Pending state. Covers insufficient
  resources, missing secrets/configmaps, unschedulable nodes, and taints.
lifecycle: ACTIVE

owner:
  type: system

incidentMatching:
  incidentType: kubernetes.pod.pending
  severity: [medium, high]
  environment: [production, staging]

triggers:
  - type: condition
    conditions:
      - field: resource.kind
        operator: equals
        value: Pod
      - field: resource.phase
        operator: equals
        value: Pending

requiredEvidence:
  - namespace
  - pod_name
  - node_name

stages:
  - stageId: investigate-pending-pod
    name: Investigate Pending Pod
    type: INVESTIGATION
    order: 1
    description: Gather scheduling events and pod detail
    runbooks:
      - runbookId: RB-K8S-INVESTIGATE-POD
        parameterMappings:
          pod: "${incident.resource.pod}"
          namespace: "${incident.resource.namespace}"
        required: true
    failurePolicy: STOP

  - stageId: manual-remediation
    name: Manual Remediation Required
    type: MANUAL_REQUIRED
    order: 2
    description: Scheduling blocks require human action — check quotas, taints, node capacity
    runbooks: []
    failurePolicy: ESCALATE

risk:
  level: MEDIUM
  blastRadius: pod
  reversible: true
  rollbackStrategy: NONE

policy:
  required: false

approval:
  mode: AUTOMATIC

rollback:
  strategy: NONE

escalation:
  enabled: true
  maxAttempts: 2
  escalateTo: oncall-platform
