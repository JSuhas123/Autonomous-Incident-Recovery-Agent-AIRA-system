apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-K8S-IMAGEPULL-001
semver: 1.1.0
name: Kubernetes ImagePullBackOff Recovery
description: >
  Diagnostic playbook for pods stuck in ImagePullBackOff.
  Investigates image availability, registry credentials, and deployment config.
lifecycle: ACTIVE

owner:
  ownerType: system
  name: AIRA Platform
  team: site-reliability

incident:
  types:
    - ImagePullBackOff
    - ErrImagePull
    - kubernetes.pod.imagepull
  severities:
    - P2
    - P3
    - high
    - medium
  providers:
    - kubernetes

requiredEvidence:
  - resource.pod
  - resource.namespace

conditions:
  minimumConfidence: 0.6

risk:
  level: MEDIUM
  blastRadius: deployment

policy:
  required: false

approval:
  mode: AUTOMATIC

stages:
  - id: diagnose-image-pull
    order: 1
    name: Diagnose ImagePull Failure
    type: INVESTIGATION
    description: Collect pod events and image pull error details
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-K8S-INVESTIGATE-IMAGEPULL
        required: true
        parameterMappings:
          pod: "${incident.resource.pod}"
          namespace: "${incident.resource.namespace}"

  - id: manual-remediation
    order: 2
    name: Manual Remediation Required
    type: MANUAL_REQUIRED
    description: ImagePullBackOff requires human action — fix image tag, registry creds, or network policy
    failurePolicy: ESCALATE
    runbooks: []

rollback:
  strategy: NONE

escalation:
  maxRecoveryAttempts: 1
  escalateTo: platform-engineering
  notifyChannels:
    - slack-platform

outcome:
  captureLearning: true

tags:
  - kubernetes
  - imagepull
  - registry
