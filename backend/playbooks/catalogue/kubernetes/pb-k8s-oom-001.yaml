apiVersion: aira.io/v1
kind: Playbook
playbookId: PB-K8S-OOM-001
semver: 1.1.0
name: Kubernetes OOMKilled Pod Recovery
description: >
  Recovery playbook for pods terminated with OOMKilled (Out Of Memory).
  Investigates memory usage, scales deployment if needed, restarts pod.
lifecycle: ACTIVE

owner:
  ownerType: system
  name: AIRA Platform
  team: site-reliability

incident:
  types:
    - OOMKilled
    - kubernetes.pod.oomkilled
    - OutOfMemory
  severities:
    - P1
    - P2
    - critical
    - high
  providers:
    - kubernetes

requiredEvidence:
  - resource.pod
  - resource.namespace

conditions:
  minimumConfidence: 0.65

risk:
  level: HIGH
  blastRadius: deployment

policy:
  required: true

approval:
  mode: MANUAL

stages:
  - id: investigate-memory
    order: 1
    name: Investigate OOMKilled Pod
    type: INVESTIGATION
    description: Collect previous logs, events, and resource limits for OOM analysis
    failurePolicy: CONTINUE
    runbooks:
      - runbookId: RB-K8S-INVESTIGATE-OOM
        required: true
        parameterMappings:
          pod: "${incident.resource.pod}"
          namespace: "${incident.resource.namespace}"
          deployment: "${incident.resource.deployment}"

  - id: restart-oom-pod
    order: 2
    name: Restart OOMKilled Pod
    type: RECOVERY
    description: Restart the OOMKilled pod to restore service
    failurePolicy: ROLLBACK
    runbooks:
      - runbookId: RB-K8S-RESTART-POD
        required: true
        parameterMappings:
          pod: "${incident.resource.pod}"
          namespace: "${incident.resource.namespace}"

  - id: verify-pod-health
    order: 3
    name: Verify Pod Health After OOM Recovery
    type: VERIFICATION
    failurePolicy: ESCALATE
    runbooks:
      - runbookId: RB-K8S-VERIFY-POD
        required: true
        parameterMappings:
          pod: "${incident.resource.pod}"
          namespace: "${incident.resource.namespace}"

rollback:
  strategy: NONE

escalation:
  maxRecoveryAttempts: 2
  escalateTo: oncall-sre
  notifyChannels:
    - slack-alerts

outcome:
  captureLearning: true
  updateIncidentMemory: true

tags:
  - kubernetes
  - oom
  - memory
  - pod
