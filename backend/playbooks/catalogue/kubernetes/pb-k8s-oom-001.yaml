apiVersion: aira.io/v1
kind: Playbook

playbookId: PB-K8S-OOM-001
semver: 1.0.0

name: Kubernetes OOMKilled Recovery

description: >
  Deterministic recovery workflow for Kubernetes containers terminated
  with OOMKilled. AIRA first verifies the termination reason and current
  memory configuration. Any resource-limit modification requires approval.
  AI never directly modifies workload specifications.

lifecycle: ACTIVE

owner:
  ownerType: system
  name: AIRA Platform
  team: site-reliability

incident:
  types:
    - OOMKilled
    - PodOOMKilled
    - kubernetes.pod.oomkilled
    - K8S_OOM_KILLED

  severities:
    - P1
    - P2
    - critical
    - high

  providers:
    - kubernetes
    - k8s

  environments:
    - production
    - staging

requiredEvidence:
  - resource.pod
  - resource.namespace

conditions:
  minimumConfidence: 0.8

  requiredSignals:
    - pod_name
    - namespace
    - termination_reason

triggers:
  all:
    - field: incident.type
      operator: contains
      value: oom

risk:
  level: HIGH
  blastRadius: workload

policy:
  required: true

approval:
  mode: REQUIRED

  conditions:
    requiresApproval: true

stages:
  - id: investigate-memory
    order: 1
    name: Investigate Memory Failure
    type: INVESTIGATION

    description: >
      Confirm OOMKilled termination and collect current memory
      requests, limits, restart count, sibling pod health,
      deployment ownership, and node memory conditions.

    failurePolicy: ESCALATE

    runbooks:
      - runbookId: RB-K8S-INVESTIGATE-OOM
        versionConstraint: ">=1.0.0"
        required: true

        parameterMappings:
          pod: "${incident.resource.pod}"
          namespace: "${incident.resource.namespace}"

  - id: validate-resource-change
    order: 2
    name: Validate Memory Adjustment
    type: VALIDATION

    description: >
      Determine whether an approved resource adjustment is available
      for the affected controller. No arbitrary limit value may be
      generated by the AI.

    failurePolicy: ESCALATE

    runbooks:
      - runbookId: RB-K8S-VALIDATE-MEMORY-CHANGE
        versionConstraint: ">=1.0.0"
        required: true

        parameterMappings:
          pod: "${incident.resource.pod}"
          namespace: "${incident.resource.namespace}"
          deployment: "${incident.resource.deployment}"

  - id: approval
    order: 3
    name: Approve Resource Change
    type: APPROVAL

    description: >
      Human approval is required before changing Kubernetes
      workload memory configuration.

    failurePolicy: ESCALATE

  - id: adjust-memory
    order: 4
    name: Apply Approved Memory Configuration
    type: RECOVERY

    description: >
      Apply only the policy-approved memory configuration
      generated by the deterministic parameter resolution path.

    failurePolicy: ROLLBACK

    runbooks:
      - runbookId: RB-K8S-ADJUST-MEMORY
        versionConstraint: ">=1.0.0"
        required: true

        parameterMappings:
          namespace: "${incident.resource.namespace}"
          deployment: "${incident.resource.deployment}"
          memory_request: "${resolved.memory_request}"
          memory_limit: "${resolved.memory_limit}"

  - id: verify-rollout
    order: 5
    name: Verify Workload Recovery
    type: VERIFICATION

    description: >
      Confirm the new workload revision becomes available,
      pods remain Ready, and OOMKilled does not recur during
      the verification window.

    failurePolicy: ROLLBACK

    runbooks:
      - runbookId: RB-K8S-VERIFY-DEPLOYMENT
        versionConstraint: ">=1.0.0"
        required: true

        parameterMappings:
          namespace: "${incident.resource.namespace}"
          deployment: "${incident.resource.deployment}"

rollback:
  strategy: RUNBOOK

  runbook:
    runbookId: RB-K8S-ROLLBACK-RESOURCE-CONFIG
    versionConstraint: ">=1.0.0"

    parameterMappings:
      namespace: "${incident.resource.namespace}"
      deployment: "${incident.resource.deployment}"
      previous_revision: "${execution.previous_revision}"

escalation:
  maxRecoveryAttempts: 1
  condition: >
    verification_failed OR oom_recurred OR
    resource_adjustment_failed OR rollback_failed

  escalateTo: oncall-sre

  notifyChannels:
    - slack-alerts
    - pagerduty

outcome:
  captureLearning: true
  updateIncidentMemory: true

  successMetrics:
    - deployment_available
    - pods_ready
    - oom_not_repeated
    - restart_count_stable

tags:
  - kubernetes
  - oom
  - memory
  - resource-exhaustion
  - sre
  - recovery