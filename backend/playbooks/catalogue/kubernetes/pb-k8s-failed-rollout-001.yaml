apiVersion: aira.io/v1
kind: Playbook

playbookId: PB-K8S-ROLLOUT-001
semver: 1.0.0

name: Kubernetes Failed Rollout Recovery

description: >
  Deterministic recovery workflow for Kubernetes Deployments that fail
  to reach the desired ready replica count after a rollout.
  AIRA identifies the affected revision, validates rollback eligibility,
  requires approval, performs a bounded rollback, and verifies recovery.

lifecycle: ACTIVE

owner:
  ownerType: system
  name: AIRA Platform
  team: site-reliability

incident:
  types:
    - FailedDeployment
    - FailedRollout
    - DeploymentUnavailable
    - kubernetes.deployment.failed
    - K8S_FAILED_ROLLOUT

  severities:
    - P1
    - P2
    - critical
    - high

  providers:
    - kubernetes
    - k8s

  environments:
    - production
    - staging

requiredEvidence:
  - resource.namespace
  - resource.deployment

conditions:
  minimumConfidence: 0.8

  requiredSignals:
    - namespace
    - deployment

triggers:
  all:
    - field: incident.type
      operator: contains
      value: rollout

risk:
  level: HIGH
  blastRadius: deployment

policy:
  required: true

approval:
  mode: REQUIRED

  conditions:
    requiresApproval: true

stages:
  - id: investigate-rollout
    order: 1
    name: Investigate Failed Rollout
    type: INVESTIGATION

    description: >
      Collect deployment state, current revision, ReplicaSets,
      pod health, container failure reasons, recent rollout events,
      and service impact.

    failurePolicy: ESCALATE

    runbooks:
      - runbookId: RB-K8S-INVESTIGATE-ROLLOUT
        versionConstraint: ">=1.0.0"
        required: true

        parameterMappings:
          namespace: "${incident.resource.namespace}"
          deployment: "${incident.resource.deployment}"

  - id: determine-rollback
    order: 2
    name: Validate Rollback Target
    type: VALIDATION

    description: >
      Determine the last known healthy deployment revision.
      Rollback is allowed only when a verified previous revision exists.

    failurePolicy: ESCALATE

    runbooks:
      - runbookId: RB-K8S-RESOLVE-ROLLBACK-TARGET
        versionConstraint: ">=1.0.0"
        required: true

        parameterMappings:
          namespace: "${incident.resource.namespace}"
          deployment: "${incident.resource.deployment}"

  - id: approval
    order: 3
    name: Approve Deployment Rollback
    type: APPROVAL

    description: >
      Human approval is required before production or staging
      deployment rollback.

    failurePolicy: ESCALATE

  - id: rollback-deployment
    order: 4
    name: Roll Back Failed Deployment
    type: RECOVERY

    description: >
      Roll the deployment back only to the validated previous
      healthy revision.

    failurePolicy: ESCALATE

    runbooks:
      - runbookId: RB-K8S-ROLLBACK-DEPLOYMENT
        versionConstraint: ">=1.0.0"
        required: true

        parameterMappings:
          namespace: "${incident.resource.namespace}"
          deployment: "${incident.resource.deployment}"
          revision: "${resolved.rollback_revision}"

  - id: verify-deployment
    order: 5
    name: Verify Deployment Recovery
    type: VERIFICATION

    description: >
      Verify rollout completion, ready replicas, pod readiness,
      restart stability, and workload availability.

    failurePolicy: ESCALATE

    runbooks:
      - runbookId: RB-K8S-VERIFY-DEPLOYMENT
        versionConstraint: ">=1.0.0"
        required: true

        parameterMappings:
          namespace: "${incident.resource.namespace}"
          deployment: "${incident.resource.deployment}"

rollback:
  strategy: NONE

escalation:
  maxRecoveryAttempts: 1

  condition: >
    rollback_target_missing OR rollback_failed OR
    verification_failed

  escalateTo: oncall-sre

  notifyChannels:
    - slack-alerts
    - pagerduty

outcome:
  captureLearning: true
  updateIncidentMemory: true

  successMetrics:
    - deployment_available
    - desired_replicas_ready
    - rollout_complete
    - pods_ready
    - error_rate_recovered

tags:
  - kubernetes
  - deployment
  - rollout
  - rollback
  - sre
  - recovery