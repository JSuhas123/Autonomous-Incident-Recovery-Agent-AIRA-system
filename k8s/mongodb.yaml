apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aira-mongodb
  namespace: aira
  labels:
    app: aira
    component: mongodb
spec:
  serviceName: aira-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: aira
      component: mongodb
  template:
    metadata:
      labels:
        app: aira
        component: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "admin"
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aira-secrets
              key: mongodb-password
        - name: MONGO_INITDB_DATABASE
          value: "decision_engine"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aira-mongodb
  namespace: aira
  labels:
    app: aira
    component: mongodb
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: aira
    component: mongodb
  ports:
  - port: 27017
    targetPort: 27017
    name: mongodb
