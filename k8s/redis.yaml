apiVersion: apps/v1
kind: Deployment
metadata:
  name: aira-redis
  namespace: aira
  labels:
    app: aira
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aira
      component: redis
  template:
    metadata:
      labels:
        app: aira
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aira-redis
  namespace: aira
  labels:
    app: aira
    component: redis
spec:
  type: ClusterIP
  selector:
    app: aira
    component: redis
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
