apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aira-ingress
  namespace: aira
  labels:
    app: aira
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
  - host: aira.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aira-backend
            port:
              number: 80
  - host: localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aira-backend
            port:
              number: 80
