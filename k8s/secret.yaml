# TEMPLATE — do NOT commit real secrets to git.
# Generate base64 values: echo -n 'value' | base64
# Apply with: kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: aira-secrets
  # IMPORTANT: namespace must match the deployment namespace (aira).
  # The old value was 'default' which made this secret invisible to pods.
  namespace: aira
  labels:
    app: aira
type: Opaque
data:
  # echo -n 'mongodb+srv://user:password@cluster/decision_engine' | base64
  mongodb-uri: <base64-encoded-mongodb-uri>
  # echo -n 'amqp://user:password@rabbitmq-host:5672' | base64
  # RABBITMQ_URL moved here from ConfigMap because it contains credentials.
  rabbitmq-url: <base64-encoded-rabbitmq-url>
  # echo -n 'your-slack-bot-token' | base64
  slack-token: <base64-encoded-slack-token>
  # echo -n 'strong-random-secret-min-32-chars' | base64
  audit-secret: <base64-encoded-audit-secret>
  # echo -n 'strong-random-token-for-internal-endpoints' | base64
  # Used to protect /metrics and /health/detailed from unauthenticated access.
  internal-api-token: <base64-encoded-internal-api-token>
