apiVersion: apps/v1
kind: Deployment
metadata:
  name: aira-frontend
  namespace: aira
  labels:
    app: aira
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aira
      component: frontend
  template:
    metadata:
      labels:
        app: aira
        component: frontend
    spec:
      containers:
      - name: frontend
        image: aira-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: aira-frontend
  namespace: aira
  labels:
    app: aira
    component: frontend
spec:
  type: NodePort
  selector:
    app: aira
    component: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30300
    protocol: TCP
    name: http
