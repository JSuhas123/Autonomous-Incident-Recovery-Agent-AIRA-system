apiVersion: v1
kind: ConfigMap
metadata:
  name: aira-config
  namespace: aira
  labels:
    app: aira
data:
  NODE_ENV: "production"
  PORT: "5000"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"
  DISABLE_MEMORY_DB: "true"
  ALLOW_IN_MEMORY_LOCKS: "false"
  CORS_ORIGIN: "*"
  REDIS_URL: "redis://aira-redis:6379"
  RABBITMQ_URL: "amqp://aira:airapass@aira-rabbitmq:5672"
